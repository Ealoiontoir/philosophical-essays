<script type="application/json" id="essay-data">{"ru": {"title": "Государство после человека", "subtitle": "Власть, алгоритм и право на непредсказуемость. Европа между 2026 и 2040 годами.", "epigraph": "Чтобы управлять человеком, не нужно отнимать у него свободу. Достаточно незаметно переставить мебель в комнате, где он её осуществляет.", "intro": ["Есть комнаты, в которых мы прожили так долго, что перестали их видеть. Привычка, этот медлительный и терпеливый обойщик, обтянула их стены таким ровным и тёплым равнодушием, что лишь в ночь бессонницы, когда в темноте вдруг проступают очертания незнакомого шкафа и мы не можем вспомнить, где окно, нам открывается, что комната всё это время была чужой и только притворялась нашей. Европейская политика сегодня похожа на такую комнату. Её стены обиты процедурами, её окна выходят на выборы, её мебель расставлена законами, и всё в ней настолько знакомо, что требуется бессонница, чтобы заметить, как кто-то, не спрашивая нас и, возможно, даже без злого умысла, начал переставлять вещи.", "Главный тезис этого эссе прост и неприятен. Угроза будущего не в том, что машина восстанет против человека. Восстание предполагает врага, лицо, баррикаду. Угроза в том, что человек окажется внутри системы управления, которая продолжает действовать от его имени и всё меньше нуждается в его присутствии. Ей не нужно его побеждать. Ей достаточно научиться без него обходиться.", "Это не пророчество. Это траектория, и её первые отрезки уже проложены, каждый с разумным обоснованием, каждый с подписью ответственного лица, каждый как временная мера. Двадцатый век научил нас бояться власти, которая кричит. Двадцать первому предстоит научиться распознавать власть, которая вежливо сообщает, что ваше обращение обработано.", "Осенью 2026 года Франция выходит на улицы. Школьники, студенты и профсоюзы протестуют против нищеты образования, нехватки учителей, обветшавших классов и цены жизни, которая растёт быстрее надежды. 6 октября демонстрации прошли в разных городах Франции. 16 октября на улицы Милана вышли учащиеся, протестуя против образовательной политики правительства и голодного пайка государственных школ.", "Сами по себе эти шествия ещё не цифровой авторитаризм. Но они ставят вопрос, от которого больше нельзя отвернуться. Что случится, когда давнее, уже привычное недоверие между обществом и институтами встретит технологии, способные предвидеть, классифицировать и ограничивать человеческое поведение раньше, чем оно состоялось?", "Мы привыкли воображать это будущее как сцену из кино. Шагающие машины у подножия Марианны на площади Республики, дроны над Сеной, лица граждан на огромных экранах, молодые люди, которые валят столбы с камерами, перепрыгивают турникеты с разбитыми мониторами и уходят на рассвете по обломкам роботов. В этой картине есть утешение, потому что в ней есть враг, которого видно, и баррикада, на которой можно стоять.", "Но в ту же октябрьскую неделю, когда школьники шли по бульварам, настоящая драма разворачивалась почти без зрелища. Она шла в экстренных обновлениях, в отозванных сертификатах, в заражённом пакете, который прожил в сети около 2 часов, в британских государственных сайтах, которые гасли один за другим не от взлома, а из предосторожности. Улица и сервер оказались двумя сценами одного спектакля. Этот спектакль о том, кто вправе объявить бурю и кто потом решает, когда она закончилась."], "chapters": [{"title": "История не повторяется. Повторяется вопрос", "paragraphs": ["Бывает, что случайный запах, мокрый камень мостовой после дождя или пыль старого школьного коридора, вдруг поднимает из небытия целый город, с его колокольнями, булочными и утрами, которых мы не помнили, потому что не знали, что храним их; и тогда прошлое является не как сведение, а как присутствие. Европейские протесты действуют на историческую память так же. Подросток с самодельным плакатом на парижском бульваре в октябре 2026 года не цитирует ни Декларацию, ни лозунги Сорбонны, но стоит смотреть на него достаточно долго, и за его спиной начинают проступать другие улицы, другие осени, другие юные лица, словно в одной фигуре уместились два с лишним столетия одного и того же неразрешённого спора.", "В августе 1789 года Учредительное собрание приняло Декларацию прав человека и гражданина. Её вторая статья назвала среди естественных и неотъемлемых прав свободу и сопротивление угнетению. Двенадцатая сформулировала то, что сегодня звучит как обвинительный акт, составленный заранее. Публичная сила учреждается для пользы всех, а не для частной выгоды тех, кому она доверена.", "В этих строках родилась новая легитимность. Государство больше не существует ради себя. Оно обязано оправдываться перед человеком.", "Но та же революция, провозгласившая свободу, очень скоро научилась убивать от её имени, и гильотина работала под тем же небом, под которым читали Декларацию. Так впервые обнаружился закон, который европейская история потом будет подтверждать с монотонностью маятника. Институт, созданный ради ценности, рано или поздно начинает служить собственному сохранению, и делает это тем увереннее, чем благороднее ценность, на которую он ссылается.", "В мае 1968 года французские студенты восстали против иерархий университета и общества, и к ним присоединились миллионы рабочих, остановивших страну. Теперь спор шёл уже не о форме государства, а о фактуре повседневности. О том, кто решает, как учиться, как работать, кому подчиняться и что считать нормальной жизнью.", "В 2026 году протестуют их внуки. Их требования конкретны до прозаичности. Учителя, стены, бюджеты, будущее. Парижская и миланская молодёжь не является единым революционным субъектом, у неё разные лозунги, разные обиды и разные политические горизонты. Но под всеми этими различиями проходит одна трещина.", "Молодой человек входит в общество, которое уже знает о нём почти всё заранее, какое образование ему положено, какой труд его ждёт, насколько он полезен, каково его вероятное будущее и какие формы поведения для него допустимы. И это же общество торжественно сообщает ему, что именно он является источником власти.", "Политический взрыв назревает там, где человек формально признан субъектом власти, но в каждом своём дне переживает себя её объектом.", "В 1789 году спор шёл о праве человека быть гражданином. В 1968 году о праве переделать собственную жизнь. К 2040 году он может коснуться предмета ещё более глубокого и ещё более хрупкого. Права человека оставаться неопределённым, не до конца вычисленным, не окончательно классифицированным той системой, которая его обслуживает.", "Чтобы понять, откуда растёт этот вопрос, нужно вернуться к Мишелю Фуко."]}, {"title": "Фуко. Власть, которой больше не нужен король", "paragraphs": ["Фуко совершил в политической философии переворот, сопоставимый с тем, как живопись однажды перестала писать короля и начала писать свет. Классическая мысль спрашивала, кто обладает властью, государь, класс или партия. Фуко спросил иначе. Как власть осуществляется, через какие жесты, какие расписания, какие таблицы, какие стены и окна.", "И обнаружилось, что власть живёт не только в парламенте и полиции. Она живёт в планировке больничного коридора, в школьной ведомости, в фабричном гудке, в медицинской классификации, в статистической норме, в бланке, который нужно заполнить, чтобы существовать для администрации.", "В книге Надзирать и наказывать (1975) Фуко проследил, как публичная казнь, это кровавое зрелище суверенной мести, уступила место тихой повседневной дисциплине. Прежний государь показывал свою силу на теле преступника. Новая власть стремится организовать поведение человека прежде, чем тот успеет нарушить норму. Наблюдение, сравнение и классификация оказались действеннее палача.", "Паноптикум Бентама стал для Фуко архитектурной формулой этого сдвига. Заключённый в освещённой камере не знает, смотрят ли на него в эту минуту из тёмной башни, и потому ведёт себя так, будто смотрят всегда. Надзиратель постепенно переселяется внутрь заключённого. Дисциплина становится самодисциплиной, а самодисциплина начинает называть себя характером.", "Ошибкой было бы прочитать Фуко как обличителя одного лишь репрессивного государства. Власть у него не только запрещает, она производит. Знания, роли, способы, которыми человек понимает самого себя. Школа действительно учит. Медицина действительно лечит. Администрация действительно удерживает общество от распада. Но эти же институты решают, что считать нормальным, успешным, здоровым, опасным и отклоняющимся, и решают это так давно, что их решения перестали выглядеть решениями.", "Здесь мысль Фуко встречается с тем, что можно назвать наркозом привычки. Мы не замечаем узора обоев в комнате, где живём годами, и замечаем его лишь в чужом гостиничном номере, где тот же узор вдруг кажется вызывающим и странным. Так и власть становится невидимой не тогда, когда прячется, а тогда, когда обживается.", "Власть сильнее всего не тогда, когда принуждает, а тогда, когда перестаёт ощущаться как власть и начинает казаться устройством мира.", "Поэтому мысль Фуко глубже любой теории заговора. Власти не нужен единый центр и не нужен единый злой умысел. Множество учреждений, каждое со своей скромной и разумной целью, способны вместе выткать сеть контроля, которую никто целиком не задумывал и никто целиком не видит."]}, {"title": "От дисциплины к биополитике, от биополитики к алгоритму", "paragraphs": ["В лекциях конца 1970-х годов Фуко развил понятие биовласти и исследовал то, что назвал governmentality, рациональности и техники управления населением. Объектом власти становится не только отдельное тело, но и жизнь как совокупность. Продолжительность жизни, рождаемость, заболеваемость, мобильность, занятость, риски, распределение ресурсов.", "В этом нет ничего зловещего самого по себе. Без статистики, эпидемиологии и планирования не было бы ни современной медицины, ни социального государства, ни пенсий, ни прививок. Проблема начинается не там, где общество считает.", "Она начинается там, где описание человека незаметно превращается в приговор о его ценности. Человек больше не просто получает помощь, образование или защиту. Он становится пучком показателей, категорий и вероятностей, и именно этот пучок, а не он сам, вступает в переговоры с государством.", "В 1990 году Жиль Делёз в Постскриптуме об обществах контроля продолжил мысль Фуко. Дисциплинарное общество строилось вокруг замкнутых пространств, школы, фабрики, больницы, тюрьмы, и человек переходил из одной ограды в другую. Обществу контроля ограды не нужны. Оно сопровождает человека непрерывно, как модуляция, как сигнал, который следует за ним из среды в среду и нигде не прерывается.", "В цифровую эпоху эта мысль перестала быть метафорой. Чтобы быть классифицированным учреждением, больше не нужно находиться внутри него. Кредитоспособность, профессиональные шансы, административные права и поведение на платформах сплетаются в одну ткань оценок, и ни одна нить этой ткани не держится на воле самого человека.", "Здесь необходимо различие, от которого зависит всё остальное. Цифровизация облегчает доступ к услугам, стряхивает бюрократическую пыль, расширяет человеческие возможности. Алгоритмическое управление делает другое. Оно позволяет вычисленной оценке брать верх над живыми обстоятельствами человека. Эти явления не тождественны. Но они живут в одной инфраструктуре, питаются из одного источника данных, и граница между ними проходит не по коду, а по политической воле.", "Поэтому главный конфликт будущего развернётся не между человеком и машиной. Он развернётся между двумя принципами. В одном технология остаётся инструментом человеческих целей. В другом человек становится настраиваемым элементом оптимизируемой системы."]}, {"title": "Когда общество становится вычислимым", "paragraphs": ["Есть старая история о человеке, который так боялся потерять возлюбленную, что поселил её в своём доме, следил за каждой её прогулкой, расспрашивал шофёра о каждом повороте, сверял её рассказы с рассказами подруг и составлял в уме огромную картотеку её взглядов, опозданий, полуулыбок и случайно оброненных имён; и чем полнее становилась картотека, тем дальше уходила от него она сама, потому что всё, что он мог узнать, относилось к её маршрутам, а всё, чего он узнать не мог, и было ею. Пленница, о которой известно всё, остаётся беглянкой. Эту историю полезно помнить всякий раз, когда государство решает, что знать о человеке достаточно много значит знать человека.", "Метафора, однако, нуждается в документе. И документы есть.", "В Нидерландах система поиска предполагаемого мошенничества с пособиями на детей стала механизмом одной из самых тяжёлых административных катастроф послевоенной Европы. Десятки тысяч семей были ложно заподозрены, на них обрушились требования вернуть огромные суммы, люди теряли дома, работу, а некоторые и детей. Гражданство и другие данные использовались при оценке рисков, и это превратило систему в инструмент дискриминации. В январе 2021 года правительство Нидерландов ушло в отставку.", "Виноват был не один алгоритм. Виноваты были законы, процедуры, политические решения, культура подозрения внутри ведомств. Именно поэтому этот случай так красноречив. Для катастрофы не потребовалась сверхразумная машина. Хватило системы, в которой ошибочная классификация получила силу государственного решения, а человеку оказалось почти невозможно доказать, что он не тот, кем его посчитали.", "Там же действовала система SyRI, созданная для выявления рисков мошенничества в социальной сфере. В 2020 году суд в Гааге признал правовую основу её применения несовместимой с правом на частную жизнь. Этот приговор показал обе стороны медали. Алгоритмическое профилирование опасно. Демократический суд способен его остановить. Но только после того, как оно уже успело поработать.", "Франция даёт свидетельство иного рода. Готовясь к Олимпийским играм 2024 года, власти разрешили экспериментальное применение алгоритмического видеоанализа для обнаружения определённых ситуаций в общественных пространствах, брошенных предметов, движения против потока толпы, опасных скоплений людей. Речь не шла о распознавании лиц. Речь шла о машинном взгляде, который учится отличать нормальное течение улицы от подозрительного. Эксперимент был временным. Впоследствии эксперимент возобновили до 31 декабря 2027 года; 19 марта 2026 года Конституционный совет признал соответствующее положение закона конституционным. Вопрос о реальной пользе и соразмерности такой системы при этом не исчез.", "Ни один из этих фактов не доказывает существования плана тотального контроля. Они доказывают нечто более тревожное. Инфраструктура наблюдения растёт не по плану, а по прецеденту, через цепь ограниченных, юридически оформленных и каждый раз временных решений, и временное в ней обладает удивительной способностью доживать до старости.", "Каждое отдельное решение разумно.", "Снизить преступность.", "Предотвратить катастрофу.", "Найти мошенника.", "Сэкономить бюджет.", "Ускорить процедуру.", "Но разумность каждого шага ничего не говорит о разумности дороги. Можно спускаться по лестнице, каждая ступень которой рассчитана безупречно, и прийти в подвал."]}, {"title": "Как власть теряет лицо", "paragraphs": ["Есть имена, которые в детстве светились для нас, как витражи. Название приморского городка, обещавшее бурю, готические своды и туман над скалами; фамилия старинного рода, в которой слышались звон меча и шёпот гобеленов. А потом мы приезжали, выходили из поезда на обыкновенный перрон с вокзальным буфетом, и род оказывался гостиной со скучными людьми, и имя продолжало звучать, как прежде, но уже ничего не обещало. Демократия рискует стать таким именем. Мы будем произносить его с прежней интонацией, не замечая, что за ним теперь другой город.", "В традиционном государстве хотя бы формально можно установить, кто принял решение. Министр определяет политику. Чиновник исполняет. Суд проверяет. Гражданин жалуется, и у жалобы есть адрес.", "В цифровом управлении цепочка вытягивается до неузнаваемости. Политики ставят общую цель. Ведомство закупает программу. Частная компания пишет модель. Данные собирают третьи организации. Система выдаёт оценку риска. Служащий подписывает решение, опираясь на оценку, которую не он создал и которую не он способен проверить.", "Юридически ответственность никуда не исчезает. Практически она растворяется, как сахар в чае, оставаясь в каждой капле и не находясь ни в одной.", "В исследовании 2025 года о применении ИИ в государственном управлении Александр Вуттке, Адриан Раухфляйш и Андреас Юнгхерр выделили три фундаментальные проблемы передачи решений алгоритмам. Возможность оценить их работу. Зависимость от них. Возможность их оспорить. Их данные показывают, что рост эффективности поначалу укрепляет доверие граждан и одновременно ослабляет в них ощущение, что они хоть как-то управляют действиями государства.", "Отсюда парадокс успешной автоматизации. Чем лучше система работает, тем сильнее от неё зависят. Чем сильнее зависимость, тем дороже отказ. Чем дороже отказ, тем труднее обществу обсуждать уже не отдельные ошибки системы, а сам вопрос о том, должна ли она существовать.", "Так демократия может сохранить свою форму, как раковина хранит форму моллюска, который давно её покинул. Выборы остаются выборами. Но всё большая часть реального управления перемещается в инфраструктуру, чьи цели, пороги и допущения скрыты от тех, во имя кого она работает.", "Возникает демократия, в которой народ выбирает руководителей, но больше не влияет на архитектуру решений, которыми эти руководители пользуются."]}, {"title": "Экономика контроля", "paragraphs": ["Государство не монолит. Внутри него сталкиваются интересы, живёт профессиональная честь, работают суды, и есть люди, которые всерьёз защищают общее благо. Утверждать, будто государство целиком служит элитам, значит упрощать.", "Но столь же наивно не видеть асимметрии между гражданином и организациями, у которых есть капитал, данные, эксперты и доступ к тем, кто принимает решения.", "Крупнейшие технологические компании создают системы, без которых государственные учреждения скоро не смогут выполнять собственные функции. Государство получает инструменты управления. Корпорации получают контракты, доступ к данным в пределах закона, власть над стандартами и ту особую прочность, которую даёт глубокое врастание продукта в чужую жизнь. Гражданин получает услуги и не получает голоса в том, как устроена их подземная часть.", "Для этого не нужен тайный центр. Фуко искал бы не всемогущего кукловода, а будничные механизмы, которыми множество самостоятельных интересов сплетаются в устойчивую власть. Алгоритмическая централизация возможна и без политической. Достаточно, чтобы разные учреждения зависели от одних и тех же поставщиков, одних и тех же моделей, одних и тех же метрик эффективности. Тогда тысяча независимых решений начинает звучать в унисон, и этот унисон принимают за объективность.", "Ещё в 1980 году Лэнгдон Уиннер спросил, есть ли у технических объектов политика. Его ответ был утвердительным. Технологию нужно судить не только по пользе, но и по тем отношениям власти, которые она поддерживает или делает практически неизбежными. Высота моста может решать, какие автобусы доедут до пляжа, а значит, кто будет на нём отдыхать.", "Значит, вопросы о том, кому принадлежат вычислительные мощности, как пишутся условия государственных закупок, допускается ли независимый аудит и можно ли сменить поставщика, вовсе не технические. Это вопросы о том, где сегодня находится власть."]}, {"title": "Неделя, когда трещины заговорили", "paragraphs": ["Бывает, что в доме, где мы прожили полжизни, однажды ночью раздаётся сухой треск, и мы впервые слышим, что у стен есть голос, что балки, на которые мы опирались, не вечны, а лишь терпеливы, и что всё это время они держали нас не из верности, а по инерции, которую мы принимали за прочность. Цифровая Европа услышала такой треск в одну октябрьскую неделю 2026 года, ту самую, когда парижские школьники шли по бульварам.", "В субботу 17 октября вечером Mozilla получила сообщение о том, что закрытые ключи 8 промежуточных сертификатов индийского удостоверяющего центра eMudhra скомпрометированы. Такие сертификаты принадлежат к незаметной иерархии, которая позволяет браузеру поверить, что сайт банка действительно банк. Ключи, созданные ещё в апреле 2025 года, оказались настолько слабыми, что их можно было вычислить из открытых сертификатов практически мгновенно, и один из них был попросту числом 4. Сама компания допустила, что исследователь мог прибегнуть к методам с помощью ИИ. Около 1,5 года часть фундамента цифрового доверия стояла на цифре, которую ребёнок называет одной из первых. Первоначальная оценка миграции после отзыва доверия к корню составляла около 30 000 клиентских сертификатов, а Mozilla лишила доверия корневой сертификат, от которого они происходили.", "В тот же день, 17 октября, сеть ловушек Amazon зафиксировала попытку эксплуатации уязвимости, о которой мир ещё не знал. Через 3 дня её подробности утекли в сеть раньше назначенного срока. 21 октября разработчики PHP выпустили экстренные исправления 2 критических ошибок, получивших общее имя PHP2Shell. Они позволяли без всякой авторизации выполнить чужой код на сервере и затрагивали версии языка от PHP 5.4 до 8.5. Британский Национальный центр кибербезопасности узнал о проблеме от OpenAI на предыдущей неделе, до публичного раскрытия. В выборке Qualys около 71% установок PHP работали на версиях, срок обычной поддержки которых истёк. Для некоторых старых веток были подготовлены ограниченные переносы исправлений, но это не возвращает им полноценную поддержку. За первые 12 часов после раскрытия исправления получили около 199 000 установок пакетов в этой выборке.", "22 октября британский министр сообщила палате лордов, что 32 государственных сервиса недоступны и ещё 4 работают частично. Правительство подчёркивало, что отключения в основном предупредительные и не означают взлома. Национальный центр кибербезопасности разослал 50 000 предупреждений. В парламентском обсуждении упоминались и недоступные муниципальные сайты. Предупредительное отключение оказалось частью защиты инфраструктуры; само по себе оно не доказывает ни взлома, ни политического умысла.", "В тот же день 21 октября злоумышленники захватили механизм публикации LiteLLM, популярного шлюза между приложениями и языковыми моделями, у которого около 23 млн загрузок в неделю, и примерно 2 часа распространяли заражённую версию 1.107.0. Вредоносный код жил не в исходном тексте, который может прочесть человек, а в собранных пакетах, которые устанавливает машина. Он запускался при каждом старте Python и забирал ключи к облакам и к самим моделям ИИ. Это был уже второй захват того же проекта за год.", "А несколькими днями раньше похищенная учётная запись доверенного приложения резервного копирования ConnectWise была использована для входа в облачные среды Microsoft 365 множества организаций. По данным Huntress, почти 1 000 таких сред зафиксировала попытки входа, и более 300 из них оказались успешными. Исследователи Sophos заметили, что обход шёл строго по возрастанию идентификаторов, с безразличной аккуратностью автомата, который не выбирает жертву, а перебирает список. Вредоносных программ для этого не понадобилось. Хватило доверия, однажды выданного и никем не отозванного.", "Ни одно из этих событий не стало катастрофой в кинематографическом смысле. Не было взрывов, не было шагающих машин на площадях, никто не валил столбы с камерами. Было другое. За одну неделю обнаружилось, что цифровая жизнь Европы стоит на 4 тихих допущениях, и каждое из них оказалось хрупким.", "Первое допущение гласило, что сложность защищает. Многие ошибки жили десятилетиями не потому, что их нельзя было увидеть, а потому, что найти их и превратить в оружие требовало редкого знания и огромного труда. Машинный поиск уязвимостей снимает этот барьер. Он одинаково служит тому, кто чинит, и тому, кто ломает, и выигрывает тот, кто успеет первым.", "Второе допущение касалось времени. Организации живут по календарю согласований, тестов и окон обслуживания, рассчитанному на недели. Аналитики Amazon сформулировали это с холодной ясностью. Срок в 7 или 30 дней на исправление предполагает задержку, которой больше не существует. Эмбарго не удерживает тайну, тайна не удерживает атаку, и между раскрытием слабости и её использованием остаются часы.", "Третье допущение касалось доставки. Мы привыкли проверять код, но не путь, которым он к нам приходит. Случай LiteLLM показал, что можно прочесть исходный текст до последней строки и всё равно впустить в свой дом чужую волю, потому что опасность жила не в тексте, а в упаковке.", "Четвёртое допущение касалось самого доверия. Сертификаты eMudhra и приложение ConnectWise не были взломаны в привычном смысле. Они были тем, чему система верила по определению. Когда ломается то, что удостоверяет подлинность, ломается не дверь, а само понятие двери.", "Вспомним ревнивца из старой истории, который запер возлюбленную, чтобы знать о ней всё. Он не заметил, что ключ от его собственной квартиры давно лежит у соседей, а замок открывается числом 4. Государство учится предсказывать гражданина, но публичное число отключённых сервисов ещё не даёт гражданину прозрачной картины его собственной инфраструктуры. Оно учится видеть человека насквозь и не уверено, что видит себя.", "Власть, которая требует от человека полной прозрачности, сама стоит на фундаменте, прочность которого она не в силах гарантировать."]}, {"title": "Хаос как ресурс", "paragraphs": ["В детстве гроза наводила в доме особый порядок. Едва над садом темнело и первые тяжёлые капли ударяли по листьям, все споры смолкали, взрослые закрывали ставни, кто-то зажигал лампу, и вдруг становилось ясно, кто в этом доме главный, потому что слушались того, кто знал, где свечи и как перекрыть воду. Гроза не устанавливала власть. Она её обнаруживала и на время делала бесспорной.", "Карл Шмитт определил суверена как того, кто решает о чрезвычайном положении. Джорджо Агамбен показал, как в двадцатом веке чрезвычайное положение из исключения превратилось в обычную технику управления. Наоми Кляйн описала, как кризисы используют для проведения решений, которые в спокойное время общество отвергло бы. Её тезис спорен, но трудно оспорить простое наблюдение. Паника редко бывает временем публичных дебатов.", "Хаосу не нужно быть созданным, чтобы быть использованным. Здесь Фуко снова уберегает от теории заговора. Не требуется тайный центр, который поджигает улицы и закладывает трещины в код. Достаточно того, что каждая буря возвращает власти её древнюю роль единственного взрослого в доме, а за каждую ночь грозы общество платит небольшой долей своего права спрашивать. Утром гроза проходит. Ставни часто остаются закрытыми.", "Октябрь 2026 года дал Европе два хаоса одновременно. Хаос снизу, человеческий, с лицами, лозунгами и требованиями, который можно выслушать, с которым можно спорить и договариваться. И хаос из машины, безличный и беззвучный, который нельзя выслушать, потому что он ничего не требует. Первый власти неудобен, он задаёт вопросы. Второй, при всей своей опасности, вопросов не задаёт и подсказывает только один ответ. Больше полномочий, больше наблюдения, больше скорости, меньше обсуждения.", "Опасность в том, что эти два хаоса могут оказаться в одной графе отчёта о рисках. Протест станет ещё одной аномалией в потоке данных, рядом с подозрительным пакетом и сломанным сертификатом, и к нему начнут применять ту же логику, что к уязвимости. Обнаружить. Изолировать. Отключить. В неделю, когда государственные сервисы отключали из предосторожности, отключение стало мерой защиты, и для конкретной технической угрозы оно могло быть разумным. Но всякий жест, однажды ставший разумным в одной сфере, ищет себе применения в другой.", "Есть и перемена, о которой почти не говорили. О слабости, угрожавшей британским государственным системам, правительство узнало от частной лаборатории искусственного интеллекта, ещё на предыдущей неделе, до публичного раскрытия. Это был жест ответственности, и за него стоит быть благодарным. Но в нём обнажилось новое распределение силы. Если знание о трещинах государства рождается у частного субъекта, то вопрос о том, когда, кому и в каком порядке это знание сообщить, перестаёт быть только государственным. Суверенитет начинает зависеть от добросовестности тех, кто видит дальше.", "Если продолжить эту неделю до 2040 года, обнаружатся по меньшей мере 4 сценария, и все они уже начаты.", "Первый можно назвать крепостью. Каждая волна машинных уязвимостей оправдывает новый временный режим, обязательный постоянный мониторинг сетей, право отключать сервисы без объяснений. Защита инфраструктуры и защита от граждан постепенно сливаются в одно ведомство и один язык.", "Второй можно назвать опекой. Государства, не способные сами найти собственные трещины, всё глубже зависят от нескольких частных лабораторий, которые видят уязвимости первыми. Защита становится услугой, услуга становится условием, и граница между партнёрством и зависимостью размывается так же, как размывалась ответственность в цепочке алгоритмических решений.", "Третий можно назвать выключателем. Отключение, однажды опробованное как мера кибербезопасности, становится универсальным инструментом. Связь в районе протеста, платёжный сервис, транспортная карта, доступ к порталу государственных услуг выключаются предупредительно, по оценке риска, которую никто не обязан раскрывать, если технические меры останутся без содержательного публичного объяснения.", "Четвёртый можно назвать открытым городом. Те же машины, что находят уязвимости, становятся общественным достоянием. Независимые исследователи, университеты и гражданские организации проверяют государственный код так же быстро, как его могли бы атаковать. Раскрытие уязвимостей подчиняется публичным правилам, а инфраструктура доверия контролируется не только корпорациями и спецслужбами.", "Какой из них победит, зависит не от мощности моделей. Это зависит от того, кто будет держать выключатель и сможет ли кто-нибудь спросить его, зачем он его повернул.", "Хаос не отменяет демократию. Он проверяет, умеет ли она оставаться демократией в темноте."]}, {"title": "Между 2035 и 2040 годами. Проекция уже работающих механизмов", "paragraphs": ["Будущее не выводится из настоящего, как теорема из аксиом. Но можно проследить цепь условий, при которых один сценарий становится вероятнее остальных.", "Допустим, до 2040 года сохраняется давление на государственные бюджеты, растёт запрос на безопасность, ускоряется автоматизация, учреждения всё глубже врастают в частную цифровую инфраструктуру, а доверие к политическому представительству продолжает таять. Тогда алгоритмическое управление будет расширяться последовательно, как вода, которая не штурмует плотину, а ищет трещины.", "Сначала оно займёт области, где выгода измерима и бесспорна. Документы, административные услуги, распределение ресурсов, транспорт, выявление нарушений.", "Затем придёт соблазн прогноза. Учреждения захотят не реагировать на события, а знать их вероятность заранее. В медицине, при стихийных бедствиях, в защите от насилия такие инструменты будут спасать жизни.", "И именно тогда возникнет искушение перенести логику прогноза на политическое и социальное поведение. Граница между предотвращением насилия и предупреждением нежелательного гражданского действия станет самой важной границей эпохи. Право может её удерживать. Но если политическая погода переменится, появится возможность классифицировать группы людей не по тому, что они сделали, а по вычисленным признакам того, что они, вероятно, сделают.", "В таком мире протест перестанет быть только высказыванием. Он станет объектом риск-анализа, моделирования, информационного воздействия и упреждающего администрирования.", "Чтобы обезвредить демонстрацию, её не обязательно запрещать. Можно изменить доступ к площадям, усложнить процедуру согласования, раздробить коммуникацию, отвести информационные потоки в другое русло, автоматически пометить событие как потенциальную угрозу. Каждая из этих мер по отдельности может быть законной. Демократическое государство действительно обязано защищать людей от насилия. Опасность начинается там, где критерии безопасности перестают быть публично проверяемыми и систематически вытесняют право на несогласие.", "К 2040 году так может сложиться особый тип политического порядка. Не диктатура в учебниковом смысле, с вождём на балконе и танками на площади. Скорее управляемое общество, в котором многие решения выглядят технически неизбежными, хотя в их основании лежат вполне политические предпочтения, просто переодетые в цифры.", "Государство будет постоянно ссылаться на объективность вычислений. Но вычисление не знает, каким должно быть хорошее общество. Оно умеет искать средства для заданных целей. Кто задаёт цели и кто вправе их менять, остаётся вопросом политическим, и тот, кто называет его техническим, уже ответил на него за нас."]}, {"title": "Склон, а не судьба", "paragraphs": ["В этом месте пророчество обычно начинает пугать себя собственной неизбежностью, и в этом его главная слабость. Идея неизбежного будущего не просто ошибочна. Она работает на ту самую систему, которую описывает, потому что убеждает людей, что действовать бессмысленно.", "Европа не беззащитна. AI Act запрещает определённые формы социального рейтинга, манипулятивные практики, некоторые виды прогнозирования индивидуального преступного поведения и дистанционную биометрическую идентификацию в реальном времени для правоохранительных целей в общественных местах, с узко очерченными исключениями. Общий регламент защиты данных даёт человеку гарантии против решений, принятых исключительно автоматически и существенно затрагивающих его жизнь.", "Но закон в этой истории не стена, а береговая линия, и вода испытывает её постоянно. Исключения из запретов пишутся теми же руками, что и запреты. Временные режимы продлеваются. Французский видеоанализ начинался как олимпийская мера и пережил Олимпиаду. Нидерландский суд остановил SyRI, но лишь после того, как система успела поработать. Право способно ставить пределы. Оно не способно ставить их само.", "При этом те же вычислительные системы способны усиливать не только власть над обществом, но и власть общества над государством. Они могут вскрывать коррупционные схемы, находить ошибки в решениях, разбирать бюджеты, переводить законы с канцелярского языка на человеческий, открывать правовую информацию тем, кто прежде не мог её себе позволить. Обзор OECD 2025 года, основанный на 200 примерах использования ИИ в государственном секторе, описывает и эти возможности, и риски непрозрачности, ошибок и размывания подотчётности.", "Значит, перед нами две дороги, вымощенные одним и тем же камнем. На одной государство с помощью вычислений расширяет свою способность видеть и направлять общество. На другой общество с помощью вычислений расширяет свою способность видеть и исправлять государство. Технически возможны обе. Какая станет главной, решат законы, суды, собственность на инфраструктуру, гражданская культура и политическая воля.", "Вопрос не в том, станет ли ИИ достаточно мощным.", "Вопрос в том, кто будет устанавливать границы его власти, и успеет ли он сделать это прежде, чем каждое удобное решение незаметно сузит окно.", "В этом и разрешается мнимое противоречие между тревогой и надеждой. Будущее не предрешено. Но оно и не стоит на месте, дожидаясь, пока мы определимся. Оно наклонено, и каждый день, прожитый в бездействии, прибавляет склону градус."]}, {"title": "Протест как непредусмотренное действие", "paragraphs": ["Вернёмся на улицы Парижа и Милана.", "Протест легко романтизировать. В нём смешиваются справедливые требования, политические амбиции, солидарность, страх, ярость и расчёт тех, кто умеет греть руки у чужого огня. Присутствие на улице не гарантирует правоты. Насилие против случайных людей, разгром общественных учреждений, травля несогласных не становятся оправданными оттого, что совершаются во имя освобождения.", "И всё же протест незаменим для демократии. Он напоминает государству, что жизнь общества не сводится к управлению им и что законность институтов ещё не отвечает на вопрос об их легитимности.", "Ханна Арендт связывала свободу со способностью человека начинать. Действие у неё не воспроизводит существующих условий, оно вносит в мир то, чего в нём прежде не было. Эту способность она связывала с natality, с фактом рождения, с тем, что в мир снова и снова приходят новые люди и каждый из них есть возможность начала.", "Здесь политическая свобода и логика предсказания расходятся окончательно. Для системы управления идеальная предсказуемость означает устранение неопределённости. Для истории полное устранение неопределённости означало бы устранение нового.", "Свобода при этом не хаос. Это право оставаться действующим лицом, способным изменить убеждения, войти в публичный спор, пересмотреть порядок вещей и оспорить решение, принятое о тебе без тебя.", "Свобода не есть отсутствие порядка. Свобода есть возможность участвовать в пересмотре порядка, которому ты подчинён.", "Когда эта возможность исчезает, политика превращается в администрирование населения, а гражданин в пользователя, которому разрешено оставлять отзывы.", "Здесь видна последняя связь между улицей и сервером. Протест есть хаос с лицом. Он говорит, требует, ошибается, и потому с ним можно говорить. Сбой в машине есть хаос без лица, с ним говорить нельзя, его можно только устранить. Если государство разучится различать эти два беспорядка, оно начнёт обращаться с гражданином как с уязвимостью, которую нужно закрыть прежде, чем о ней узнают."]}, {"title": "Власть без властителя", "paragraphs": ["Самая тревожная перспектива связана не с восстанием машин, а с рассеиванием ответственности, при котором зло не совершается, а случается.", "В классическом авторитаризме у власти есть лицо. В будущем её функции могут распределиться между множеством институтов и технических посредников так равномерно, что указать на лицо станет невозможно. Отдельные системы, вероятно, научатся планировать цепочки действий, выбирать средства для заданных целей и координировать работу других программ. Это не значит, что у них появятся желания, убеждения или политическая воля. Действовать в соответствии с целью ещё не значит переживать цель как собственный интерес.", "Опасность прозаичнее и потому серьёзнее. Люди задают цели. Учреждения закрепляют их в процедурах. Машины исполняют процедуры всё эффективнее. А затем эффективность процедуры становится доводом против её пересмотра. Человеку предлагают уже не обсуждать будущее, а приспособиться к наиболее оптимальной версии решения, принятого до него.", "Так возникает власть без властителя. Злого умысла в ней может не быть вовсе. Но ограничивать свободу она способна не хуже умышленного принуждения, потому что против умысла можно восстать, а против процедуры можно только подать заявление.", "Джеймс Скотт в книге Благими намерениями государства (1998) показал, почему великие проекты рационального переустройства общества так часто кончались катастрофой. Государство заменяло живую, запутанную, непрозрачную сложность социальной жизни упрощённой схемой, удобной для управления сверху, а потом пыталось заставить жизнь соответствовать схеме.", "У Пруста волшебный фонарь бросает на стены детской спальни всадника в плаще, и как этот всадник, наткнувшись на дверную ручку, послушно изгибается, переламывается, ложится на её медь, не переставая быть всадником и ни на миг не становясь дверью. Алгоритм обходится с человеком так же. Его проекция может стать сколь угодно подробной, она обогнёт каждую складку нашей жизни, каждую привычку и каждую слабость. Но она остаётся светом на стене. Модель человеческой жизни, сколько бы данных её ни питало, не становится жизнью, и даже совершенное описание прошлого не даёт права распоряжаться будущим."]}, {"title": "Что нужно удержать до 2040 года", "paragraphs": ["Если эти размышления чего-то стоят, они должны закончиться не только тревожным пейзажем, но и перечнем того, что нельзя отдавать.", "У любой автоматизированной системы, существенно влияющей на права человека, должен быть установимый ответственный субъект, человек или орган, которого можно назвать по имени.", "Решения, затрагивающие жизнь, свободу и возможности человека, должны допускать содержательное оспаривание, а не вежливое уведомление о том, что данные обработаны корректно.", "Критерии общественной безопасности должны быть определены законом и соразмерны реальной угрозе.", "Экспериментальные полномочия наблюдения не должны сами собой становиться постоянными. Всякое временное должно получать дату смерти при рождении.", "Государственная технологическая инфраструктура должна оставаться доступной для независимого аудита, общественного контроля и, насколько это возможно, замены.", "И политическое решение о целях не должно подменяться техническим выводом о наилучших средствах их достижения.", "Часть этих принципов в европейском праве уже существует. Задача периода до 2040 года в том, чтобы они не превратились в имена, которые продолжают звучать, ничего не обещая.", "Это не отказ от прогресса. Это требование, чтобы прогресс расширял человеческую свободу, а не превращал её в побочный показатель административной эффективности."]}, {"title": "Человек как незавершённое существо", "paragraphs": ["Мы умираем много раз за одну жизнь. Тот, кем мы были в 20 лет, с его страстями, страхами и тем единственным лицом, без которого мир казался невозможным, однажды тихо уходит, и на его место приходит другой, который помнит его, как помнят дальнего родственника, и уже не понимает, отчего тот так страдал. Мы не замечаем этих смертей, потому что каждый следующий наследует имя и паспорт предыдущего. Но всякий, кто после долгой разлуки встречал человека, которого когда-то любил, знает, что встретил незнакомца с знакомой фамилией.", "Алгоритм хранит верность умершим. Он знает того, кем мы были, по всем его покупкам, маршрутам и задержкам взгляда, и с почтительной точностью предлагает живому человеку жизнь покойника. Ему не нужно нас ненавидеть, чтобы нас запереть. Ему достаточно быть верным нашему прошлому.", "Поэтому самый глубокий вопрос будущего не в том, превзойдёт ли машина человеческий интеллект. В некоторых областях она уже превзошла. В других остаётся ограниченной и ненадёжной. Но ум и право определять цели общей жизни не одно и то же. Система может найти оптимальный способ распределения ресурсов по заданному критерию. Выбор самого критерия, справедливости, достоинства, солидарности, свободы, принадлежит суждению, которое нельзя передать другому, не отказавшись от себя.", "И здесь открывается второй, ещё более тихий слой опасности. Фуко показал, что власть производит не только послушание, но и самого субъекта. Значит, долгая жизнь среди алгоритмических оценок способна изменить не только наше поведение, но и само наше представление о свободе. Человек, которому с детства подсказывают следующий шаг, следующую песню, следующую профессию, может однажды перестать отличать желание от рекомендации. Ему не нужно будет запрещать выбирать. Он сам забудет, как это делается, и будет искренне считать подсказку своим вкусом. В этой точке политическая философия переходит в антропологию, а вопрос о власти становится вопросом о том, что останется от человека, которым так удобно управлять.", "Против этого у человека есть одно странное оружие. Бывает, что, споткнувшись о неровный камень во дворе, мы вдруг чувствуем, как из-под ног поднимается целый забытый город, его свет, его вода, его утро, которых не было ни в одном нашем отчёте о себе, и понимаем, что носили его в себе всё это время, не подозревая. История кликов не исчерпывает этого города. Даже точный прогноз не заменяет самого возвращения — света, воды, утра, которые человек переживает сейчас. Непрошеное воспоминание, внезапная любовь, необъяснимый отказ, поступок, которого мы от себя не ждали, не доказывают принципиальной невозможности вычисления. Они напоминают о другом: описание человека не исчерпывает его жизни, а вероятность поступка не даёт права решать за него. Его будущее ещё не прожито.", "Человек не завершённый объект, все свойства которого можно установить заранее. Он способен меняться, ошибаться, отрекаться от прежних убеждений, создавать непредвиденные формы связи и действовать вопреки самому себе. Эта незавершённость делает возможными искусство, политику и историю. И она же есть главная помеха для любой системы, которая хочет управлять человеком окончательно.", "Отсюда центральный парадокс эпохи, к которой мы приближаемся.", "Чем точнее цивилизация научится предсказывать человека, тем решительнее ей придётся защищать его право не совпадать со своим предсказанием.", "Революционеры 1789 года не знали, какой станет Европа через два столетия. Студенты 1968 года не могли предвидеть последствий собственных баррикад. Молодёжь, которая сегодня идёт по бульварам Парижа и улицам Милана, тоже не знает, какие формы общей жизни родятся из нынешних трещин. Но это незнание не слабость. Это условие истории.", "Будущее не лежит где-то готовым, как письмо, которое осталось вскрыть. Оно складывается в столкновении обстоятельств, структур и поступков, и последнее слово в этом столкновении ещё не сказано.", "Поэтому 2040 год не нужно изображать неизбежным триумфом технологического контроля. Его нужно видеть развилкой, к которой мы идём, каждый день немного сужая или расширяя обе дороги.", "Будет ли Европа обществом, где технологии помогают гражданам осуществлять власть? Или обществом, где технологии помогают власти обходиться без граждан?", "Снаружи эти два будущих могут оказаться почти неразличимы. В обоих будут умные города, цифровые услуги, автоматизированные системы, выборы и права, записанные в конституциях. Разница будет не в декорациях, а в одном жесте. В первом человек сможет изменить систему, которой пользуется. Во втором ему останется к ней приспосабливаться.", "Вернёмся к картинам, с которых началось это эссе. Молодые люди, идущие на рассвете по обломкам машин, не пророчество, а сон, и сон утешительный, потому что в нём свобода снова завоёвывается руками. Настоящая развилка тише. Она проходит там, где инженер в 02:00 решает, обновить сервер или выключить его. Где министр решает, называть ли отключённые службы. Где частная лаборатория решает, кому первым рассказать о трещине. Где школьник решает, выйти ли утром на бульвар.", "Ключ к целому слою цифрового доверия однажды оказался числом 4. Может быть, в этом и состоит урок октября. Система, которая собирается вычислить человека до конца, сама держится на допущениях, которых никто не проверял, и её прочность так же не завершена, как и человек. Значит, спор ещё открыт с обеих сторон, и машина в нём не судья. Она — созданный людьми инструмент, чьи ограничения не отменяют ответственности тех, кто поручает ему решения.", "И тогда старый вопрос европейской истории вернётся в новом обличье, как возвращается давно забытый запах, от которого вдруг перехватывает дыхание.", "Не кто властвует.", "А кто ещё способен изменить саму логику власти."]}], "sources": ["Декларация прав человека и гражданина, 1789. Официальный текст на сайте Елисейского дворца", "Richard Wolin, The Events of May 1968, Encyclopaedia Britannica", "Michel Foucault, Surveiller et punir (1975); La volonté de savoir (1976); Sécurité, territoire, population (1977–1978). Stanford Encyclopedia of Philosophy", "Gilles Deleuze, Post-scriptum sur les sociétés de contrôle (1990); Postscript on the Societies of Control, October, №59, 1992. JSTOR", "Amnesty International, Xenophobic Machines. Dutch Child Benefit Scandal, 2021", "Marvin van Bekkum, Frederik Zuiderveen Borgesius, Digital Welfare Fraud Detection and the Dutch SyRI Judgment, 2025", "CNIL, 2024 Olympics. Questions on Privacy and Freedoms; Конституционный совет Франции, решение 2026-902 DC от 19 марта 2026 года, статья 47", "Alexander Wuttke, Adrian Rauchfleisch, Andreas Jungherr, Artificial Intelligence in Government. Why People Feel They Lose Control, 2025", "Langdon Winner, Do Artifacts Have Politics?, Daedalus, 1980", "European Commission, AI Act; Rights in Relation to Automated Decision-Making", "OECD, Governing with Artificial Intelligence. The State of Play and Way Forward in Core Government Functions, 2025", "Hannah Arendt, The Human Condition (1958). Stanford Encyclopedia of Philosophy", "James C. Scott, Seeing Like a State, Yale University Press, 1998", "LWN.net, eMudhra intermediate CA compromise, по сообщению Mozilla; Help Net Security, eMudhra security blunder left trusted CA signing keys exposed; The Hacker News, Eight eMudhra CA Keys Compromised; The Register, eMudhra's private keys compromised", "Amazon Threat Intelligence, PHP2Shell exploitation prior to public disclosure in MadPot; Qualys, PHP2Shell exposure; Wikipedia, PHP2Shell", "House of Lords, Hansard, Cyber Security: PHP Vulnerability, 22 октября 2026", "LiteLLM, Security incident, Oct 21, 2026; Datadog Security Labs, LiteLLM supply chain compromise", "Sophos X-Ops, ConnectWise Cloud Backup application abused in cross-tenant token sweep; BleepingComputer, Hackers breach Microsoft 365 tenants via ConnectWise supply chain attack", "Carl Schmitt, Politische Theologie (1922); Giorgio Agamben, Stato di eccezione (2003); Naomi Klein, The Shock Doctrine (2007)"], "sourceNote": "Исторические примеры и сообщения о киберинцидентах сопровождаются источниками. Их политическое сопоставление является авторской интерпретацией. Описание периода между 2035 и 2040 годами является условной проекцией действующих механизмов, а не доказанным прогнозом."}, "en": {"title": "The State After the Human", "subtitle": "Power, the algorithm, and the right to unpredictability. Europe between 2026 and 2040.", "epigraph": "To govern a person, there is no need to take away their freedom. It is enough to quietly rearrange the furniture in the room where they exercise it.", "intro": ["There are rooms we have lived in for so long that we have ceased to see them. Habit, that slow and patient upholsterer, has lined their walls with such an even, warm indifference that only on a sleepless night, when the outline of an unfamiliar wardrobe suddenly emerges from the darkness and we cannot remember where the window is, do we discover that the room was someone else's all along, and only pretended to be ours. European politics today resembles such a room. Its walls are upholstered in procedures, its windows look out on elections, its furniture is arranged by laws, and everything in it is so familiar that it takes a night of sleeplessness to notice that someone, without asking us and perhaps without even intending harm, has begun to move things around.", "The central argument of this essay is simple and unpleasant. The danger ahead is not that the machine will rise up against humanity. An uprising implies an enemy, a face, a barricade. The danger is that people will find themselves inside a system of government that continues to act in their name while having ever less need of their presence. It does not need to defeat them. It merely needs to learn to do without them.", "This is not a prophecy. It is a trajectory, and its first stretches have already been laid, each with a reasonable justification, each bearing the signature of someone responsible, each as a temporary measure. The 20th century taught us to fear power that shouts. The 21st will have to learn to recognise power that politely informs you that your request has been processed.", "In the autumn of 2026, France takes to the streets. School pupils, students, and trade unions protest against the poverty of education, the shortage of teachers, dilapidated classrooms, and a cost of living that rises faster than hope. On 6 October, demonstrations took place in several French cities. On 16 October, students took to the streets of Milan to protest against the government's education policy and the starvation rations allotted to state schools.", "These marches do not in themselves amount to digital authoritarianism. But they pose a question from which we can no longer turn away. What will happen when the long-standing, now familiar distrust between society and its institutions encounters technologies capable of anticipating, classifying, and restricting human behaviour before it has occurred?", "We are accustomed to imagining this future as a scene from a film. Walking machines at the foot of Marianne in the Place de la République, drones above the Seine, citizens' faces on enormous screens, young people toppling camera poles, vaulting turnstiles with shattered monitors, and walking away at dawn across the wreckage of robots. There is consolation in this picture, because it offers a visible enemy and a barricade on which to stand.", "Yet in that same October week, as school pupils walked along the boulevards, the real drama was unfolding almost without spectacle. It unfolded in emergency updates, revoked certificates, an infected package that spent about 2 hours online, British government websites going dark one after another, out of precaution rather than because they had been hacked. Street and server became 2 stages of the same play. The play concerns who has the right to declare a storm, and who then decides when it is over."], "chapters": [{"title": "History Does Not Repeat Itself. The Question Does", "paragraphs": ["Sometimes a chance smell, the wet stone of a pavement after rain or the dust of an old school corridor, suddenly raises an entire town out of oblivion, with its bell towers, bakeries, and mornings we did not remember because we did not know we had kept them; and then the past appears not as information but as a presence. European protests work on historical memory in the same way. A teenager carrying a homemade placard on a Paris boulevard in October 2026 is quoting neither the Declaration nor the slogans of the Sorbonne, but watch long enough and other streets, other autumns, other young faces begin to emerge behind them, as though more than 2 centuries of the same unresolved argument were contained in a single figure.", "In August 1789, the Constituent Assembly adopted the Declaration of the Rights of Man and of the Citizen. Article 2 named liberty and resistance to oppression among natural and inalienable rights. Article 12 formulated something that now sounds like an indictment drawn up in advance. Public force is instituted for the benefit of all, rather than for the private advantage of those entrusted with it.", "A new legitimacy was born in these lines. The state no longer exists for its own sake. It must justify itself before the human being.", "But the same revolution that proclaimed liberty soon learned to kill in its name, and the guillotine worked beneath the same sky under which the Declaration was read. Here, for the first time, a law emerged that European history would go on confirming with the monotony of a pendulum. An institution created for the sake of a value sooner or later begins to serve its own preservation, and does so all the more confidently the nobler the value it invokes.", "In May 1968, French students rose against the hierarchies of the university and society, and millions of workers joined them, bringing the country to a halt. The argument was now no longer about the form of the state but about the texture of everyday life. About who decides how to study, how to work, whom to obey, and what counts as a normal life.", "In 2026, their grandchildren are protesting. Their demands are concrete to the point of being prosaic. Teachers, walls, budgets, a future. The young people of Paris and Milan do not constitute a single revolutionary subject: their slogans, grievances, and political horizons differ. But a single crack runs beneath all these differences.", "A young person enters a society that already knows almost everything about them in advance: what education they are to receive, what work awaits them, how useful they are, what their probable future will be, and what forms of behaviour are permissible for them. And this same society solemnly informs them that they themselves are the source of power.", "A political explosion gathers where a person is formally acknowledged as a subject of power, yet experiences themselves as its object every day.", "In 1789, the argument concerned the human right to be a citizen. In 1968, the right to remake one's own life. By 2040, it may concern something deeper still, and more fragile: the right to remain undetermined, not fully calculated, not definitively classified by the system that serves us.", "To understand where this question comes from, we must return to Michel Foucault."]}, {"title": "Foucault. Power That No Longer Needs a King", "paragraphs": ["Foucault brought about a revolution in political philosophy comparable to the moment when painting ceased to paint the king and began to paint light. Classical thought asked who possesses power: the sovereign, the class, or the party. Foucault asked a different question. How is power exercised, through what gestures, what timetables, what tables, what walls and windows?", "And it emerged that power lives not only in parliament and the police. It lives in the layout of a hospital corridor, the school register, the factory siren, a medical classification, a statistical norm, the form one must fill in to exist for the administration.", "In Discipline and Punish (1975), Foucault traced how public execution, that bloody spectacle of sovereign vengeance, gave way to the quiet discipline of everyday life. The sovereign of old displayed his strength on the criminal's body. The new power seeks to organise human behaviour before a person has time to break the norm. Observation, comparison, and classification proved more effective than the executioner.", "Bentham's Panopticon became Foucault's architectural formula for this shift. The prisoner in an illuminated cell does not know whether anyone is watching from the dark tower at that moment, and therefore behaves as though someone is always watching. The guard gradually takes up residence inside the prisoner. Discipline becomes self-discipline, and self-discipline begins to call itself character.", "It would be a mistake to read Foucault as an accuser of the repressive state alone. For him, power does more than prohibit: it produces. Knowledge, roles, the ways in which people understand themselves. Schools really do teach. Medicine really does heal. Administration really does keep society from falling apart. But these same institutions decide what counts as normal, successful, healthy, dangerous, and deviant, and they have been deciding for so long that their decisions have ceased to look like decisions.", "Here Foucault's thought meets what we might call the anaesthesia of habit. We do not notice the wallpaper pattern in a room where we have lived for years; we notice it only in someone else's hotel room, where that same pattern suddenly seems strange and provocative. Power, too, becomes invisible not when it hides, but when it settles in.", "Power is strongest not when it coerces, but when it ceases to feel like power and begins to seem like the way the world is made.", "This is why Foucault's thought goes deeper than any conspiracy theory. Power needs neither a single centre nor a single malicious intention. A multitude of institutions, each with its own modest and reasonable purpose, can together weave a net of control that no one conceived in its entirety and no one sees in its entirety."]}, {"title": "From Discipline to Biopolitics, from Biopolitics to the Algorithm", "paragraphs": ["In his lectures of the late 1970s, Foucault developed the concept of biopower and examined what he called governmentality: the rationalities and techniques of governing populations. The object of power becomes not only the individual body but life in the aggregate. Life expectancy, birth rates, illness, mobility, employment, risks, the distribution of resources.", "There is nothing sinister in this in itself. Without statistics, epidemiology, and planning, there would be neither modern medicine nor the welfare state, neither pensions nor vaccinations. The problem does not begin where society counts.", "It begins where a description of a person quietly turns into a verdict on their worth. A person no longer merely receives help, education, or protection. They become a bundle of indicators, categories, and probabilities, and it is this bundle, rather than the person, that negotiates with the state.", "In 1990, in his Postscript on the Societies of Control, Gilles Deleuze took Foucault's thinking further. Disciplinary society was organised around enclosed spaces: school, factory, hospital, prison. A person moved from one enclosure to another. A society of control has no need of enclosures. It accompanies a person continuously, as a modulation, as a signal that follows them from one setting to another without ever breaking off.", "In the digital age, this thought has ceased to be a metaphor. You no longer need to be inside an institution for it to classify you. Creditworthiness, professional prospects, administrative entitlements, and behaviour on platforms are woven into a single fabric of assessments, and none of its threads is held by the person's own will.", "Here a distinction is necessary on which everything else depends. Digitisation makes services easier to access, shakes off bureaucratic dust, and expands human possibilities. Algorithmic governance does something different. It allows a calculated assessment to prevail over a person's living circumstances. These phenomena are not identical. But they inhabit the same infrastructure, draw on the same source of data, and the boundary between them is drawn by political will rather than by code.", "The central conflict of the future will therefore unfold between 2 principles, rather than between humanity and the machine. Under one, technology remains an instrument of human purposes. Under the other, the person becomes an adjustable component in a system being optimised."]}, {"title": "When Society Becomes Calculable", "paragraphs": ["There is an old story about a man so afraid of losing his beloved that he installed her in his house, monitored her every walk, questioned the chauffeur about every turn, checked her accounts against those of her friends, and assembled in his mind an enormous card index of her glances, late arrivals, half-smiles, and casually dropped names; and the more complete the index became, the further she herself receded from him, because everything he could discover concerned her routes, while everything he could not discover was precisely who she was. A captive about whom everything is known remains a fugitive. It is worth remembering this story whenever the state decides that knowing enough about a person means knowing the person.", "A metaphor, however, needs documentary evidence. And the documents exist.", "In the Netherlands, a system for identifying suspected child-benefit fraud became the mechanism of one of the gravest administrative disasters in post-war Europe. Tens of thousands of families were falsely suspected and faced demands to repay enormous sums; people lost homes, jobs, and in some cases their children. Nationality and other data were used in risk assessment, turning the system into an instrument of discrimination. In January 2021, the Dutch government resigned.", "The blame did not lie with a single algorithm. It lay with laws, procedures, political decisions, and a culture of suspicion within agencies. That is precisely why this case speaks so eloquently. Catastrophe required no superintelligent machine. It needed only a system in which a mistaken classification acquired the force of a state decision, and a person found it almost impossible to prove that they were not who they had been calculated to be.", "The Netherlands also used SyRI, a system designed to identify risks of welfare fraud. In 2020, a court in The Hague ruled that the legal basis for its use was incompatible with the right to privacy. The judgment revealed both sides of the matter. Algorithmic profiling is dangerous. A democratic court can stop it. But only after it has already had time to operate.", "France offers evidence of another kind. In preparation for the 2024 Olympic Games, the authorities authorised experimental algorithmic video analysis to detect specified situations in public spaces: unattended objects, movement against the flow of a crowd, dangerous gatherings of people. This was not facial recognition. It was a machine's gaze learning to distinguish the normal flow of the street from the suspicious. The experiment was temporary. The experiment was subsequently renewed until 31 December 2027; on 19 March 2026, the Constitutional Council upheld the corresponding provision of the law. Questions about the actual usefulness and proportionality of such a system nevertheless remained.", "None of these facts proves that a plan for total control exists. They establish something more troubling. Surveillance infrastructure grows through precedent rather than according to a plan, through a succession of limited, legally formalised decisions, each temporary in its turn; and the temporary has an astonishing capacity to reach old age.", "Every individual decision is reasonable.", "Reduce crime.", "Prevent a disaster.", "Find a fraudster.", "Save public money.", "Speed up a procedure.", "But the reasonableness of each step tells us nothing about the reasonableness of the road. One can descend a staircase whose every step has been impeccably calculated, and arrive in a cellar."]}, {"title": "How Power Loses Its Face", "paragraphs": ["There are names that shone for us in childhood like stained glass. The name of a seaside town promising storms, Gothic vaults, and mist above the cliffs; the surname of an ancient family in which one could hear the ring of a sword and the whisper of tapestries. Then we arrived, stepped off the train onto an ordinary platform with a station buffet, and the noble family turned out to be a drawing room full of dull people, and the name continued to sound as it always had, but promised nothing anymore. Democracy risks becoming such a name. We will pronounce it with the old intonation, without noticing that a different town now lies behind it.", "In the traditional state, it is at least formally possible to establish who made a decision. A minister determines policy. An official carries it out. A court reviews it. A citizen complains, and the complaint has an address.", "In digital governance, the chain stretches beyond recognition. Politicians set a general objective. An agency buys software. A private company writes the model. Other organisations collect the data. The system produces a risk assessment. A public employee signs a decision on the basis of an assessment they neither created nor have the ability to verify.", "Legally, responsibility has not vanished. In practice, it dissolves like sugar in tea, remaining in every drop and to be found in none.", "In a 2025 study of AI in government, Alexander Wuttke, Adrian Rauchfleisch, and Andreas Jungherr identified 3 fundamental problems in handing decisions over to algorithms. The ability to evaluate their performance. Dependence on them. The ability to contest them. Their findings indicate that increased efficiency initially strengthens citizens' trust while weakening their sense of having any control over what the state does.", "Hence the paradox of successful automation. The better the system works, the greater the dependence on it. The greater the dependence, the higher the cost of giving it up. The higher that cost, the harder it becomes for society to discuss not merely the system's individual errors, but whether it ought to exist at all.", "Democracy can thus retain its shape as a shell retains the shape of the mollusc that left it long ago. Elections remain elections. But an increasing share of actual government moves into infrastructure whose objectives, thresholds, and assumptions are hidden from those in whose name it operates.", "A democracy emerges in which the people choose their leaders but no longer influence the architecture of the decisions those leaders use."]}, {"title": "The Economics of Control", "paragraphs": ["The state is not a monolith. Interests collide within it, professional honour persists, courts function, and some people seriously defend the common good. To claim that the state serves elites in its entirety is to simplify.", "But it is equally naive to overlook the asymmetry between a citizen and organisations that possess capital, data, experts, and access to decision-makers.", "The largest technology companies are building systems without which public institutions may soon be unable to perform their own functions. The state obtains instruments of government. Corporations obtain contracts, lawful access to data, power over standards, and the peculiar durability that comes when a product grows deep into someone else's life. The citizen receives services and receives no voice in the arrangement of their underground foundations.", "No secret centre is needed. Foucault would look for the everyday mechanisms through which a multitude of independent interests intertwines into durable power, rather than for an all-powerful puppeteer. Algorithmic centralisation is possible without political centralisation. It is enough for different institutions to depend on the same suppliers, the same models, the same measures of efficiency. Then 1,000 independent decisions begin to sound in unison, and this unison is mistaken for objectivity.", "As early as 1980, Langdon Winner asked whether technical artefacts have politics. His answer was yes. Technology must be judged not only by its usefulness but also by the relations of power it sustains or makes practically inevitable. The height of a bridge can determine which buses reach the beach, and therefore who gets to spend time there.", "Questions of who owns computing capacity, how public procurement terms are written, whether independent audits are allowed, and whether a supplier can be replaced are therefore far from merely technical. They concern where power is located today."]}, {"title": "The Week the Cracks Began to Speak", "paragraphs": ["Sometimes, in a house where we have lived for half a lifetime, a dry crack sounds one night, and for the first time we hear that the walls have a voice, that the beams we have relied on are not eternal, only patient, and that all this time they have held us up through an inertia we mistook for strength, rather than out of loyalty. Digital Europe heard such a crack in an October week in 2026, the same week Parisian school pupils walked along the boulevards.", "On the evening of Saturday 17 October, Mozilla received a report that the private keys of 8 intermediate certificates belonging to the Indian certificate authority eMudhra had been compromised. Such certificates belong to the unseen hierarchy that allows a browser to believe that a bank's website really is the bank. The elliptic-curve keys, created back in April 2025, proved so weak that they could be derived from the public certificates almost immediately; one of them was simply the number 4. The company itself allowed that the researcher might have used AI-assisted methods. For 1.5 years, part of the foundation of digital trust had rested on a number among the first a child learns to name. Mozilla withdrew trust from the root certificate from which they descended; about 30,000 certificates were initially estimated to require migration following that withdrawal of trust.", "On that same day, 17 October, Amazon's network of honeypots recorded an attempt to exploit a vulnerability the world did not yet know about. Its details leaked online 3 days later, ahead of the scheduled disclosure. On 21 October, PHP's developers released emergency fixes for 2 critical flaws collectively named PHP2Shell. They allowed unauthenticated execution of arbitrary code on a server and affected versions from PHP 5.4 through PHP 8.5. Britain's National Cyber Security Centre had learned of the problem from OpenAI the previous week, before public disclosure. In the Qualys sample, about 71% of PHP installations were running versions whose ordinary support had expired. Limited backports were prepared for some older branches, but this does not restore full support. In the first 12 hours after disclosure, about 199,000 package installations in that sample received patches.", "On 22 October, a British minister told the House of Lords that 32 government services were unavailable and another 4 were working only partially. The government emphasised that the shutdowns were chiefly precautionary and did not signify a breach. The National Cyber Security Centre sent 50,000 warnings. Unavailable municipal websites were also mentioned in the parliamentary discussion. Precautionary shutdown became part of infrastructure protection; by itself, it proves neither a breach nor a political intention.", "On 21 October, attackers also took over the publishing mechanism of LiteLLM, a popular gateway between applications and language models with about 23 million downloads a week, and distributed an infected version, 1.107.0, for roughly 2 hours. The malicious code lived in the built packages that machines install, rather than in the source code a person can read. It ran whenever Python started and stole keys to cloud services and to the AI models themselves. This was already the project's 2nd takeover that year.", "A few days earlier, a stolen credential for a trusted ConnectWise backup application had been used to enter the Microsoft 365 cloud environments of numerous organisations. According to Huntress, nearly 1,000 such environments recorded login attempts, more than 300 of them successful. Sophos researchers observed that the sweep proceeded strictly in ascending order of identifiers, with the indifferent precision of an automaton working through a list rather than choosing a victim. No malware was needed. Trust, granted once and never revoked, was enough.", "None of these events became a catastrophe in the cinematic sense. There were no explosions, no walking machines in the squares, no one toppling camera poles. Something else happened. Within 1 week, it became apparent that Europe's digital life rested on 4 quiet assumptions, and each proved fragile.", "The 1st assumption was that complexity protects. Many flaws had survived for decades because finding and weaponising them demanded rare expertise and enormous labour, rather than because they were impossible to see. Machine-assisted vulnerability discovery removes this barrier. It serves the person who repairs and the person who breaks equally well, and whoever gets there first wins.", "The 2nd assumption concerned time. Organisations live by a calendar of approvals, tests, and maintenance windows measured in weeks. Amazon's analysts put it with cold clarity. A patching period of 7 or 30 days assumes a delay that no longer exists. An embargo does not preserve the secret, the secret does not hold back the attack, and only hours remain between the disclosure of a weakness and its exploitation.", "The 3rd assumption concerned delivery. We are accustomed to examining code, but not the route by which it reaches us. The LiteLLM case showed that one can read the source down to the last line and still admit someone else's will into one's home, because the danger lives in the packaging rather than in the text.", "The 4th assumption concerned trust itself. The eMudhra certificates and the ConnectWise application were not compromised in the familiar sense. They were things the system trusted by definition. When what authenticates things breaks, it is the very idea of a door that breaks, rather than the door alone.", "Remember the jealous man in the old story who locked up his beloved in order to know everything about her. He failed to notice that his neighbours had long held the key to his own flat, and that the lock opened with the number 4. The state is learning to predict the citizen, but a public count of unavailable services still does not give citizens a transparent picture of its own infrastructure. It is learning to see straight through a person and is unsure whether it can see itself.", "Power that demands complete transparency from the person itself stands on a foundation whose strength it cannot guarantee."]}, {"title": "Chaos as a Resource", "paragraphs": ["In childhood, a thunderstorm brought a particular order to the house. As soon as the sky above the garden darkened and the first heavy drops struck the leaves, every argument fell silent, the adults closed the shutters, someone lit a lamp, and suddenly it became clear who was in charge, because everyone obeyed whoever knew where the candles were and how to turn off the water. The storm did not establish authority. It revealed it and, for a time, made it unquestionable.", "Carl Schmitt defined the sovereign as the one who decides on the exception. Giorgio Agamben showed how, in the 20th century, the state of exception changed from an exception into an ordinary technique of government. Naomi Klein described how crises are used to implement decisions society would reject in calmer times. Her argument is disputed, but a simple observation is hard to contest. Panic is rarely a time for public debate.", "Chaos need not be manufactured to be used. Here Foucault again protects us from conspiracy theory. No secret centre need set fire to the streets or plant cracks in the code. It is enough that every storm restores power's ancient role as the only adult in the house, and that society pays for every night of thunder with a small part of its right to ask questions. In the morning, the storm passes. The shutters often remain closed.", "October 2026 brought Europe 2 kinds of chaos at once. Chaos from below, human, with faces, slogans, and demands, which can be heard, argued with, and negotiated with. And chaos from the machine, impersonal and silent, which cannot be heard out because it demands nothing. The 1st inconveniences power: it asks questions. The 2nd, for all its danger, asks none and suggests only 1 answer. More powers, more surveillance, more speed, less discussion.", "The danger is that these 2 kinds of chaos may end up in the same column of a risk report. Protest will become another anomaly in the data stream, alongside a suspicious package and a broken certificate, and the same logic used for a vulnerability will begin to be applied to it. Detect. Isolate. Disconnect. In the week when government services were shut down as a precaution, disconnection became a protective measure, and it could be reasonable for a specific technical threat. But every act that has once become reasonable in one domain looks for a use in another.", "Another change received almost no discussion. The government learned of the weakness threatening British public systems from a private AI laboratory the previous week, before public disclosure. This was a responsible act, for which we should be grateful. But it exposed a new distribution of power. If knowledge of the state's cracks originates with a private actor, the question of when, to whom, and in what order that knowledge is disclosed ceases to belong to the state alone. Sovereignty begins to depend on the good faith of those who can see further.", "If we extend this week towards 2040, at least 4 scenarios emerge, all of them already under way.", "The 1st might be called the fortress. Every wave of machine vulnerabilities justifies a new temporary regime, mandatory continuous network monitoring, the power to switch off services without explanation. Protection of infrastructure and protection against citizens gradually merge into a single department and a single language.", "The 2nd might be called guardianship. States unable to find their own cracks grow
