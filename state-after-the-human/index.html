increasingly dependent on a few private laboratories that see vulnerabilities first. Protection becomes a service, the service becomes a condition, and the boundary between partnership and dependence blurs just as responsibility blurred along the chain of algorithmic decisions.", "The 3rd might be called the switch. Disconnection, once tried as a cyber security measure, becomes a universal instrument. Communications in a protest area, a payment service, a transport card, access to a public services portal are switched off pre-emptively, on the basis of a risk assessment no one is obliged to disclose, if technical measures are left without a substantive public explanation.", "The 4th might be called the open city. The same machines that find vulnerabilities become a public resource. Independent researchers, universities, and civic organisations examine government code as quickly as it might be attacked. Vulnerability disclosure follows public rules, and the infrastructure of trust is overseen by more than corporations and intelligence agencies alone.", "Which of these prevails depends on who holds the switch, and whether anyone can ask why they turned it, rather than on the power of the models.", "Chaos does not abolish democracy. It tests whether democracy knows how to remain democratic in the dark."]}, {"title": "Between 2035 and 2040. A Projection of Mechanisms Already at Work", "paragraphs": ["The future cannot be deduced from the present like a theorem from axioms. But we can trace a chain of conditions under which one scenario becomes more likely than the others.", "Suppose that before 2040 pressure on public budgets persists, demand for security grows, automation accelerates, institutions grow ever deeper into private digital infrastructure, and trust in political representation continues to melt away. Algorithmic governance will then expand steadily, like water that seeks cracks rather than storming a dam.", "It will first occupy areas where the benefit is measurable and indisputable. Documents, administrative services, resource allocation, transport, identifying violations.", "Then comes the lure of prediction. Institutions will want to know the probability of events in advance rather than respond to them. In medicine, natural disasters, and protection against violence, such tools will save lives.", "And precisely then the temptation will arise to extend the logic of prediction to political and social behaviour. The boundary between preventing violence and pre-empting unwanted civic action will become the most important boundary of the age. Law can hold it. But if the political weather changes, it will become possible to classify groups of people according to calculated signs of what they are likely to do, rather than what they have done.", "In such a world, protest will cease to be only an utterance. It will become an object of risk analysis, modelling, information operations, and pre-emptive administration.", "To neutralise a demonstration, it need not be banned. Access to squares can be changed, approval procedures made more difficult, communication fragmented, information flows diverted, an event automatically flagged as a potential threat. Each measure may be lawful in isolation. A democratic state does indeed have a duty to protect people against violence. The danger begins where security criteria cease to be open to public scrutiny and systematically displace the right to dissent.", "By 2040, a particular kind of political order could emerge in this way. Rather than a dictatorship in the textbook sense, with a leader on a balcony and tanks in the square, it would be a managed society in which many decisions appear technically inevitable, although they rest on thoroughly political preferences simply dressed up as numbers.", "The state will constantly invoke the objectivity of calculation. But calculation does not know what a good society ought to be. It knows how to seek means for given ends. Who sets those ends, and who has the right to change them, remains a political question, and whoever calls it technical has already answered it on our behalf."]}, {"title": "A Slope, Not a Fate", "paragraphs": ["At this point, prophecy usually begins to frighten itself with its own inevitability, and therein lies its chief weakness. The idea of an inevitable future is more than mistaken. It serves the very system it describes, by persuading people that action is pointless.", "Europe is not defenceless. The AI Act prohibits certain forms of social scoring, manipulative practices, certain kinds of prediction of individual criminal behaviour, and real-time remote biometric identification for law enforcement in public spaces, subject to narrowly defined exceptions. The General Data Protection Regulation gives individuals safeguards against decisions made solely by automated means that significantly affect their lives.", "But law in this story is a shoreline rather than a wall, and the water tests it constantly. Exceptions to prohibitions are written by the same hands that write the prohibitions. Temporary regimes are extended. French video analysis began as an Olympic measure and outlived the Olympics. A Dutch court stopped SyRI, but only after the system had had time to operate. Law can impose limits. It cannot impose them by itself.", "At the same time, the same computational systems can strengthen society's power over the state as well as the state's power over society. They can expose corruption, find errors in decisions, examine budgets, translate laws from officialese into human language, and open legal information to those who previously could not afford it. The OECD's 2025 review, based on 200 examples of AI use in the public sector, describes these possibilities alongside the risks of opacity, error, and diluted accountability.", "We therefore face 2 roads paved with the same stone. On one, the state uses computation to expand its ability to see and direct society. On the other, society uses computation to expand its ability to see and correct the state. Both are technically possible. Laws, courts, ownership of infrastructure, civic culture, and political will shall decide which becomes the main road.", "The question is not whether AI will become powerful enough.", "The question is who will set the limits of its power, and whether they will manage to do so before every convenient decision quietly narrows the window.", "Here the apparent contradiction between anxiety and hope resolves itself. The future is not predetermined. But neither does it stand still, waiting for us to make up our minds. It is tilted, and every day spent doing nothing adds another degree to the slope."]}, {"title": "Protest as an Unforeseen Act", "paragraphs": ["Let us return to the streets of Paris and Milan.", "Protest is easy to romanticise. It mingles just demands, political ambitions, solidarity, fear, rage, and the calculations of those who know how to warm their hands at someone else's fire. Being in the street is no guarantee of being right. Violence against bystanders, the wrecking of public institutions, and the persecution of dissenters do not become justified because they are carried out in the name of liberation.", "And yet protest is indispensable to democracy. It reminds the state that society's life cannot be reduced to its administration, and that the legality of institutions does not yet answer the question of their legitimacy.", "Hannah Arendt connected freedom with the human capacity to begin. Action, for her, brings into the world something that was not there before, rather than reproducing existing conditions. She linked this capacity to natality, to the fact of birth, to the arrival of new people in the world again and again, each bearing the possibility of a beginning.", "Here political freedom and the logic of prediction part ways decisively. For a system of government, perfect predictability means eliminating uncertainty. For history, the complete elimination of uncertainty would mean eliminating the new.", "Freedom, however, is not chaos. It is the right to remain an actor, capable of changing one's convictions, entering public debate, reconsidering the order of things, and challenging a decision made about you without you.", "Freedom is not the absence of order. Freedom is the possibility of participating in the revision of the order to which you are subject.", "When that possibility disappears, politics becomes the administration of a population, and the citizen becomes a user allowed to leave feedback.", "Here the final connection between street and server becomes visible. Protest is chaos with a face. It speaks, demands, makes mistakes, and can therefore be spoken to. A machine failure is chaos without a face: it cannot be spoken to, only eliminated. If the state loses the ability to distinguish these 2 disorders, it will begin to treat the citizen as a vulnerability to be patched before anyone learns of it."]}, {"title": "Power Without a Ruler", "paragraphs": ["The most troubling prospect concerns the dispersal of responsibility, in which evil simply happens rather than being committed, instead of an uprising of machines.", "In classical authoritarianism, power has a face. In the future, its functions may be distributed so evenly among institutions and technical intermediaries that it becomes impossible to point to a face. Individual systems will probably learn to plan sequences of actions, select means for given ends, and coordinate the work of other programs. This does not mean they will acquire desires, convictions, or political will. Acting in accordance with a goal does not yet mean experiencing that goal as one's own interest.", "The danger is more prosaic, and therefore more serious. People set objectives. Institutions embed them in procedures. Machines execute the procedures with increasing efficiency. Then the efficiency of a procedure becomes an argument against revising it. People are invited to adapt to the most optimised version of a decision made before them, rather than discuss the future.", "Thus power without a ruler emerges. There may be no malicious intention in it at all. But it can restrict freedom as effectively as deliberate coercion, because one can rise against an intention, while against a procedure one can only submit an application.", "In Seeing Like a State (1998), James C. Scott showed why grand projects for the rational reorganisation of society so often ended in catastrophe. The state replaced the living, tangled, opaque complexity of social life with a simplified scheme convenient for governing from above, then tried to make life conform to the scheme.", "In Proust's childhood bedroom, a magic lantern throws a cloaked rider onto the walls, and when the rider encounters the door handle, he obediently bends, breaks, and spreads across its brass, without ceasing to be a rider or becoming a door for even an instant. An algorithm treats a person in the same way. Its projection can become as detailed as one wishes, bending around every fold of our lives, every habit, every weakness. But it remains light on a wall. A model of human life, however much data feeds it, does not become life, and even a perfect description of the past confers no right to dispose of the future."]}, {"title": "What Must Be Preserved Before 2040", "paragraphs": ["If these reflections are worth anything, they must end with more than a troubling landscape: they must also name what cannot be surrendered.", "Every automated system that significantly affects human rights must have an identifiable responsible party, a person or body that can be named.", "Decisions affecting a person's life, liberty, and opportunities must be open to substantive challenge, rather than a polite notification that the data has been processed correctly.", "Public safety criteria must be defined by law and proportionate to the actual threat.", "Experimental surveillance powers must not become permanent of their own accord. Everything temporary must receive its date of death at birth.", "Public technological infrastructure must remain open to independent audit, public scrutiny, and, as far as possible, replacement.", "And a political decision about ends must not be displaced by a technical conclusion about the best means of achieving them.", "Some of these principles already exist in European law. The task before 2040 is to keep them from becoming names that continue to sound while promising nothing.", "This is no rejection of progress. It is a demand that progress expand human freedom rather than turn it into a secondary indicator of administrative efficiency."]}, {"title": "The Human Being as an Unfinished Being", "paragraphs": ["We die many times in a single life. The person we were at 20, with their passions, fears, and that one face without which the world seemed impossible, quietly departs one day, and another takes their place, remembering them as one remembers a distant relative, no longer understanding why they suffered so much. We do not notice these deaths because each successor inherits the name and passport of the one before. But anyone who, after a long separation, has met a person they once loved knows that they encountered a stranger with a familiar surname.", "The algorithm remains faithful to the dead. It knows who we were through every purchase, journey, and lingering glance, and with reverent precision offers the living person the life of the deceased. It does not need to hate us to imprison us. Fidelity to our past is enough.", "The deepest question of the future is therefore not whether the machine will surpass human intelligence. In some fields it already has. In others it remains limited and unreliable. But intelligence and the right to determine the ends of our shared life are not the same thing. A system can find the optimal way to allocate resources according to a given criterion. The choice of the criterion itself, justice, dignity, solidarity, freedom, belongs to a judgment we cannot hand over without relinquishing ourselves.", "Here a 2nd, quieter layer of danger opens up. Foucault showed that power produces the subject itself, as well as obedience. A long life among algorithmic assessments may therefore change not only our behaviour but our very conception of freedom. A person prompted from childhood towards the next step, the next song, the next profession may one day cease to distinguish a desire from a recommendation. They will not need to be forbidden to choose. They will forget how it is done, sincerely believing the suggestion to be their own taste. At this point political philosophy becomes anthropology, and the question of power becomes a question of what will remain of a human being so conveniently governed.", "Against this, we possess a strange weapon. Sometimes, stumbling on an uneven stone in a courtyard, we suddenly feel an entire forgotten city rise beneath our feet, its light, its water, its morning, absent from every account we have given of ourselves, and realise that we have carried it within us all this time without knowing. A click history does not exhaust that city. Even an accurate prediction cannot replace the return itself: the light, the water, the morning a person experiences now. An unbidden memory, sudden love, an inexplicable refusal, an act we did not expect of ourselves do not prove that computation is impossible in principle. They remind us of something else: a description does not exhaust a person's life, and the probability of an action confers no right to decide on their behalf. Their future has not yet been lived.", "A human being is not a finished object whose properties can all be established in advance. We can change, make mistakes, renounce earlier convictions, create unforeseen forms of connection, and act against our own expectations. This unfinishedness makes art, politics, and history possible. It is also the principal obstacle to any system that wants to govern a person once and for all.", "Hence the central paradox of the age we are approaching.", "The more precisely civilisation learns to predict a person, the more resolutely it will have to defend their right not to coincide with the prediction.", "The revolutionaries of 1789 did not know what Europe would become 2 centuries later. The students of 1968 could not foresee the consequences of their own barricades. The young people walking the boulevards of Paris and the streets of Milan today likewise do not know what forms of shared life will be born from the present cracks. But this lack of knowledge is a condition of history, rather than a weakness.", "The future does not lie somewhere ready-made, like a letter waiting only to be opened. It takes shape in the collision of circumstances, structures, and actions, and the last word in that collision has not yet been spoken.", "We should therefore see 2040 as a fork towards which we are walking, each day slightly narrowing or widening both roads, rather than picture it as the inevitable triumph of technological control.", "Will Europe be a society in which technologies help citizens exercise power? Or a society in which technologies help power do without citizens?", "From the outside, these 2 futures may look almost indistinguishable. Both will have smart cities, digital services, automated systems, elections, and rights inscribed in constitutions. The difference will lie in a single gesture, rather than in the scenery. In the 1st, people will be able to change the system they use. In the 2nd, all that remains will be to adapt to it.", "Let us return to the images with which this essay began. Young people walking at dawn across the wreckage of machines are a dream rather than a prophecy, and a consoling dream because freedom is once again won by human hands. The real fork is quieter. It passes through the place where an engineer at 2 a.m. decides whether to update a server or turn it off. Where a minister decides whether to name the services that have been shut down. Where a private laboratory decides whom to tell about a crack first. Where a school pupil decides whether to go out onto the boulevard in the morning.", "The key to an entire layer of digital trust once turned out to be the number 4. Perhaps this is October's lesson. The system preparing to calculate the human being to the very end itself rests on assumptions no one has checked, and its strength is as unfinished as the human being. The argument therefore remains open on both sides, and the machine is not its judge. It is a tool created by human beings, whose limitations do not remove the responsibility of those who entrust decisions to it.", "Then the old question of European history will return in a new guise, as a long-forgotten smell returns and suddenly catches in the breath.", "Not who rules.", "But who can still change the very logic of power."]}], "sources": ["Declaration of the Rights of Man and of the Citizen, 1789. Official text on the Élysée Palace website.", "Richard Wolin, The Events of May 1968, Encyclopaedia Britannica.", "Michel Foucault, Surveiller et punir (1975); La volonté de savoir (1976); Sécurité, territoire, population (1977–1978). Stanford Encyclopedia of Philosophy.", "Gilles Deleuze, Post-scriptum sur les sociétés de contrôle (1990); Postscript on the Societies of Control, October, no. 59, 1992. JSTOR.", "Amnesty International, Xenophobic Machines: Dutch Child Benefit Scandal, 2021.", "Marvin van Bekkum, Frederik Zuiderveen Borgesius, Digital Welfare Fraud Detection and the Dutch SyRI Judgment, 2025.", "CNIL, 2024 Olympics: Questions on Privacy and Freedoms; French Constitutional Council, decision 2026-902 DC of 19 March 2026, Article 47.", "Alexander Wuttke, Adrian Rauchfleisch, Andreas Jungherr, Artificial Intelligence in Government: Why People Feel They Lose Control, 2025.", "Langdon Winner, Do Artifacts Have Politics?, Daedalus, 1980.", "European Commission, AI Act; Rights in Relation to Automated Decision-Making.", "OECD, Governing with Artificial Intelligence: The State of Play and Way Forward in Core Government Functions, 2025.", "Hannah Arendt, The Human Condition (1958). Stanford Encyclopedia of Philosophy.", "James C. Scott, Seeing Like a State, Yale University Press, 1998.", "LWN.net, eMudhra intermediate CA compromise, reporting Mozilla's notice; Help Net Security, eMudhra security blunder left trusted CA signing keys exposed; The Hacker News, Eight eMudhra CA Keys Compromised; The Register, eMudhra's private keys compromised.", "Amazon Threat Intelligence, PHP2Shell exploitation prior to public disclosure in MadPot; Qualys, PHP2Shell exposure; Wikipedia, PHP2Shell.", "House of Lords, Hansard, Cyber Security: PHP Vulnerability, 22 October 2026.", "LiteLLM, Security incident, Oct 21, 2026; Datadog Security Labs, LiteLLM supply chain compromise.", "Sophos X-Ops, ConnectWise Cloud Backup application abused in cross-tenant token sweep; BleepingComputer, Hackers breach Microsoft 365 tenants via ConnectWise supply chain attack.", "Carl Schmitt, Politische Theologie (1922); Giorgio Agamben, Stato di eccezione (2003); Naomi Klein, The Shock Doctrine (2007)."], "sourceNote": "Historical examples and reports of cyber incidents are accompanied by sources. Their political juxtaposition is the author’s interpretation. The account of the period between 2035 and 2040 is a conditional projection of mechanisms currently at work, rather than a proven forecast."}, "references": [[{"title": "Élysée", "url": "https://www.elysee.fr/la-presidence/la-declaration-des-droits-de-l-homme-et-du-citoyen"}, {"title": "French Parliament · 6 October 2026", "url": "https://lcp.fr/programmes/questions-au-gouvernement/questions-au-gouvernement-du-mardi-06-octobre-2026-441563"}, {"title": "Milan · 16 October 2026", "url": "https://www.italpress.com/studenti-in-piazza-a-milano-in-migliaia-al-corteo-nessuno-e-straniero/"}], [], [{"title": "Stanford Encyclopedia of Philosophy", "url": "https://plato.stanford.edu/entries/foucault/"}], [], [{"title": "Amnesty International", "url": "https://www.amnesty.org/en/documents/eur35/4686/2021/en/"}], [{"title": "District Court of The Hague", "url": "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBDHA:2020:1878"}], [{"title": "Décision 2026-902 DC", "url": "https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000053707307"}], [{"title": "Research paper", "url": "https://arxiv.org/abs/2505.01085"}], [], [{"title": "European Commission · AI Act", "url": "https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai"}, {"title": "EDPB · Individual rights", "url": "https://www.edpb.europa.eu/sme/be-compliant/respect-individuals-rights_en"}], [{"title": "OECD", "url": "https://www.oecd.org/en/publications/governing-with-artificial-intelligence_795de142-en.html"}], [{"title": "Stanford Encyclopedia of Philosophy", "url": "https://plato.stanford.edu/entries/arendt/"}], [], [{"title": "Mozilla", "url": "https://blog.mozilla.org/security/2026/10/20/protecting-firefox-users-following-the-compromise-of-emudhra-intermediate-certificates/"}, {"title": "Incident record", "url": "https://bugzilla.mozilla.org/show_bug.cgi?id=2083449"}, {"title": "Flüpke · public key artefact", "url": "https://gist.github.com/Fluepke/9a103c7f990c3cc2fb5002f7476f2f48"}], [{"title": "AWS Security", "url": "https://aws.amazon.com/blogs/security/amazon-threat-intelligence-identifies-php2shell-exploitation-prior-to-public-disclosure-in-madpot/"}, {"title": "Qualys", "url": "https://blog.qualys.com/vulnerabilities-threat-research/2026/10/20/php-announces-critical-security-release-for-two-vulnerabilities"}], [{"title": "Hansard · 22 October 2026", "url": "https://hansard.parliament.uk/lords/2026-10-22/debates/14CB4C6D-4E16-4377-8FCF-C2CF77BB5CC0/CyberSecurityPHPVulnerability"}], [{"title": "LiteLLM incident report", "url": "https://docs.litellm.ai/blog/security-incident-oct-21-2026"}, {"title": "Datadog Security Labs", "url": "https://securitylabs.datadoghq.com/articles/litellm-compromised-pypi-docker/"}], [{"title": "Sophos X-Ops", "url": "https://www.sophos.com/en-us/blog/connectwise-cloud-backup-application-abused-in-token-sweep"}, {"title": "Huntress", "url": "https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access"}], []], "inlineLinks": [["eMudhra", "https://blog.mozilla.org/security/2026/10/20/protecting-firefox-users-following-the-compromise-of-emudhra-intermediate-certificates/"], ["PHP2Shell", "https://aws.amazon.com/blogs/security/amazon-threat-intelligence-identifies-php2shell-exploitation-prior-to-public-disclosure-in-madpot/"], ["LiteLLM", "https://docs.litellm.ai/blog/security-incident-oct-21-2026"], ["ConnectWise", "https://www.sophos.com/en-us/blog/connectwise-cloud-backup-application-abused-in-token-sweep"], ["Qualys", "https://aws.amazon.com/blogs/security/amazon-threat-intelligence-identifies-php2shell-exploitation-prior-to-public-disclosure-in-madpot/"], ["OECD", "https://www.oecd.org/en/publications/governing-with-artificial-intelligence_795de142-en.html"], ["SyRI", "https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBDHA:2020:1878"], ["AI Act", "https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai"], ["Вуттке", "https://arxiv.org/abs/2505.01085"], ["Wuttke", "https://arxiv.org/abs/2505.01085"]], "facebook": "https://www.facebook.com/aivar.drukalskij/posts/pfbid0jsooUF9BavrPEhrCGzSQ5QGYs8cfqbsZ6vLmZekWTCXoRtxcZjfgZvSgfDUkGdjkl"}</script><script src="app.js"></script><noscript><article class="noscript"><h1>The State After the Human</h1><h2>History Does Not Repeat Itself. The Question Does</h2><p>Sometimes a chance smell, the wet stone of a pavement after rain or the dust of an old school corridor, suddenly raises an entire town out of oblivion, with its bell towers, bakeries, and mornings we did not remember because we did not know we had kept them; and then the past appears not as information but as a presence. European protests work on historical memory in the same way. A teenager carrying a homemade placard on a Paris boulevard in October 2026 is quoting neither the Declaration nor the slogans of the Sorbonne, but watch long enough and other streets, other autumns, other young faces begin to emerge behind them, as though more than 2 centuries of the same unresolved argument were contained in a single figure.</p><p>In August 1789, the Constituent Assembly adopted the Declaration of the Rights of Man and of the Citizen. Article 2 named liberty and resistance to oppression among natural and inalienable rights. Article 12 formulated something that now sounds like an indictment drawn up in advance. Public force is instituted for the benefit of all, rather than for the private advantage of those entrusted with it.</p><p>A new legitimacy was born in these lines. The state no longer exists for its own sake. It must justify itself before the human being.</p><p>But the same revolution that proclaimed liberty soon learned to kill in its name, and the guillotine worked beneath the same sky under which the Declaration was read. Here, for the first time, a law emerged that European history would go on confirming with the monotony of a pendulum. An institution created for the sake of a value sooner or later begins to serve its own preservation, and does so all the more confidently the nobler the value it invokes.</p><p>In May 1968, French students rose against the hierarchies of the university and society, and millions of workers joined them, bringing the country to a halt. The argument was now no longer about the form of the state but about the texture of everyday life. About who decides how to study, how to work, whom to obey, and what counts as a normal life.</p><p>In 2026, their grandchildren are protesting. Their demands are concrete to the point of being prosaic. Teachers, walls, budgets, a future. The young people of Paris and Milan do not constitute a single revolutionary subject: their slogans, grievances, and political horizons differ. But a single crack runs beneath all these differences.</p><p>A young person enters a society that already knows almost everything about them in advance: what education they are to receive, what work awaits them, how useful they are, what their probable future will be, and what forms of behaviour are permissible for them. And this same society solemnly informs them that they themselves are the source of power.</p><p>A political explosion gathers where a person is formally acknowledged as a subject of power, yet experiences themselves as its object every day.</p><p>In 1789, the argument concerned the human right to be a citizen. In 1968, the right to remake one&#x27;s own life. By 2040, it may concern something deeper still, and more fragile: the right to remain undetermined, not fully calculated, not definitively classified by the system that serves us.</p><p>To understand where this question comes from, we must return to Michel Foucault.</p><h2>Foucault. Power That No Longer Needs a King</h2><p>Foucault brought about a revolution in political philosophy comparable to the moment when painting ceased to paint the king and began to paint light. Classical thought asked who possesses power: the sovereign, the class, or the party. Foucault asked a different question. How is power exercised, through what gestures, what timetables, what tables, what walls and windows?</p><p>And it emerged that power lives not only in parliament and the police. It lives in the layout of a hospital corridor, the school register, the factory siren, a medical classification, a statistical norm, the form one must fill in to exist for the administration.</p><p>In Discipline and Punish (1975), Foucault traced how public execution, that bloody spectacle of sovereign vengeance, gave way to the quiet discipline of everyday life. The sovereign of old displayed his strength on the criminal&#x27;s body. The new power seeks to organise human behaviour before a person has time to break the norm. Observation, comparison, and classification proved more effective than the executioner.</p><p>Bentham&#x27;s Panopticon became Foucault&#x27;s architectural formula for this shift. The prisoner in an illuminated cell does not know whether anyone is watching from the dark tower at that moment, and therefore behaves as though someone is always watching. The guard gradually takes up residence inside the prisoner. Discipline becomes self-discipline, and self-discipline begins to call itself character.</p><p>It would be a mistake to read Foucault as an accuser of the repressive state alone. For him, power does more than prohibit: it produces. Knowledge, roles, the ways in which people understand themselves. Schools really do teach. Medicine really does heal. Administration really does keep society from falling apart. But these same institutions decide what counts as normal, successful, healthy, dangerous, and deviant, and they have been deciding for so long that their decisions have ceased to look like decisions.</p><p>Here Foucault&#x27;s thought meets what we might call the anaesthesia of habit. We do not notice the wallpaper pattern in a room where we have lived for years; we notice it only in someone else&#x27;s hotel room, where that same pattern suddenly seems strange and provocative. Power, too, becomes invisible not when it hides, but when it settles in.</p><p>Power is strongest not when it coerces, but when it ceases to feel like power and begins to seem like the way the world is made.</p><p>This is why Foucault&#x27;s thought goes deeper than any conspiracy theory. Power needs neither a single centre nor a single malicious intention. A multitude of institutions, each with its own modest and reasonable purpose, can together weave a net of control that no one conceived in its entirety and no one sees in its entirety.</p><h2>From Discipline to Biopolitics, from Biopolitics to the Algorithm</h2><p>In his lectures of the late 1970s, Foucault developed the concept of biopower and examined what he called governmentality: the rationalities and techniques of governing populations. The object of power becomes not only the individual body but life in the aggregate. Life expectancy, birth rates, illness, mobility, employment, risks, the distribution of resources.</p><p>There is nothing sinister in this in itself. Without statistics, epidemiology, and planning, there would be neither modern medicine nor the welfare state, neither pensions nor vaccinations. The problem does not begin where society counts.</p><p>It begins where a description of a person quietly turns into a verdict on their worth. A person no longer merely receives help, education, or protection. They become a bundle of indicators, categories, and probabilities, and it is this bundle, rather than the person, that negotiates with the state.</p><p>In 1990, in his Postscript on the Societies of Control, Gilles Deleuze took Foucault&#x27;s thinking further. Disciplinary society was organised around enclosed spaces: school, factory, hospital, prison. A person moved from one enclosure to another. A society of control has no need of enclosures. It accompanies a person continuously, as a modulation, as a signal that follows them from one setting to another without ever breaking off.</p><p>In the digital age, this thought has ceased to be a metaphor. You no longer need to be inside an institution for it to classify you. Creditworthiness, professional prospects, administrative entitlements, and behaviour on platforms are woven into a single fabric of assessments, and none of its threads is held by the person&#x27;s own will.</p><p>Here a distinction is necessary on which everything else depends. Digitisation makes services easier to access, shakes off bureaucratic dust, and expands human possibilities. Algorithmic governance does something different. It allows a calculated assessment to prevail over a person&#x27;s living circumstances. These phenomena are not identical. But they inhabit the same infrastructure, draw on the same source of data, and the boundary between them is drawn by political will rather than by code.</p><p>The central conflict of the future will therefore unfold between 2 principles, rather than between humanity and the machine. Under one, technology remains an instrument of human purposes. Under the other, the person becomes an adjustable component in a system being optimised.</p><h2>When Society Becomes Calculable</h2><p>There is an old story about a man so afraid of losing his beloved that he installed her in his house, monitored her every walk, questioned the chauffeur about every turn, checked her accounts against those of her friends, and assembled in his mind an enormous card index of her glances, late arrivals, half-smiles, and casually dropped names; and the more complete the index became, the further she herself receded from him, because everything he could discover concerned her routes, while everything he could not discover was precisely who she was. A captive about whom everything is known remains a fugitive. It is worth remembering this story whenever the state decides that knowing enough about a person means knowing the person.</p><p>A metaphor, however, needs documentary evidence. And the documents exist.</p><p>In the Netherlands, a system for identifying suspected child-benefit fraud became the mechanism of one of the gravest administrative disasters in post-war Europe. Tens of thousands of families were falsely suspected and faced demands to repay enormous sums; people lost homes, jobs, and in some cases their children. Nationality and other data were used in risk assessment, turning the system into an instrument of discrimination. In January 2021, the Dutch government resigned.</p><p>The blame did not lie with a single algorithm. It lay with laws, procedures, political decisions, and a culture of suspicion within agencies. That is precisely why this case speaks so eloquently. Catastrophe required no superintelligent machine. It needed only a system in which a mistaken classification acquired the force of a state decision, and a person found it almost impossible to prove that they were not who they had been calculated to be.</p><p>The Netherlands also used SyRI, a system designed to identify risks of welfare fraud. In 2020, a court in The Hague ruled that the legal basis for its use was incompatible with the right to privacy. The judgment revealed both sides of the matter. Algorithmic profiling is dangerous. A democratic court can stop it. But only after it has already had time to operate.</p><p>France offers evidence of another kind. In preparation for the 2024 Olympic Games, the authorities authorised experimental algorithmic video analysis to detect specified situations in public spaces: unattended objects, movement against the flow of a crowd, dangerous gatherings of people. This was not facial recognition. It was a machine&#x27;s gaze learning to distinguish the normal flow of the street from the suspicious. The experiment was temporary. The experiment was subsequently renewed until 31 December 2027; on 19 March 2026, the Constitutional Council upheld the corresponding provision of the law. Questions about the actual usefulness and proportionality of such a system nevertheless remained.</p><p>None of these facts proves that a plan for total control exists. They establish something more troubling. Surveillance infrastructure grows through precedent rather than according to a plan, through a succession of limited, legally formalised decisions, each temporary in its turn; and the temporary has an astonishing capacity to reach old age.</p><p>Every individual decision is reasonable.</p><p>Reduce crime.</p><p>Prevent a disaster.</p><p>Find a fraudster.</p><p>Save public money.</p><p>Speed up a procedure.</p><p>But the reasonableness of each step tells us nothing about the reasonableness of the road. One can descend a staircase whose every step has been impeccably calculated, and arrive in a cellar.</p><h2>How Power Loses Its Face</h2><p>There are names that shone for us in childhood like stained glass. The name of a seaside town promising storms, Gothic vaults, and mist above the cliffs; the surname of an ancient family in which one could hear the ring of a sword and the whisper of tapestries. Then we arrived, stepped off the train onto an ordinary platform with a station buffet, and the noble family turned out to be a drawing room full of dull people, and the name continued to sound as it always had, but promised nothing anymore. Democracy risks becoming such a name. We will pronounce it with the old intonation, without noticing that a different town now lies behind it.</p><p>In the traditional state, it is at least formally possible to establish who made a decision. A minister determines policy. An official carries it out. A court reviews it. A citizen complains, and the complaint has an address.</p><p>In digital governance, the chain stretches beyond recognition. Politicians set a general objective. An agency buys software. A private company writes the model. Other organisations collect the data. The system produces a risk assessment. A public employee signs a decision on the basis of an assessment they neither created nor have the ability to verify.</p><p>Legally, responsibility has not vanished. In practice, it dissolves like sugar in tea, remaining in every drop and to be found in none.</p><p>In a 2025 study of AI in government, Alexander Wuttke, Adrian Rauchfleisch, and Andreas Jungherr identified 3 fundamental problems in handing decisions over to algorithms. The ability to evaluate their performance. Dependence on them. The ability to contest them. Their findings indicate that increased efficiency initially strengthens citizens&#x27; trust while weakening their sense of having any control over what the state does.</p><p>Hence the paradox of successful automation. The better the system works, the greater the dependence on it. The greater the dependence, the higher the cost of giving it up. The higher that cost, the harder it becomes for society to discuss not merely the system&#x27;s individual errors, but whether it ought to exist at all.</p><p>Democracy can thus retain its shape as a shell retains the shape of the mollusc that left it long ago. Elections remain elections. But an increasing share of actual government moves into infrastructure whose objectives, thresholds, and assumptions are hidden from those in whose name it operates.</p><p>A democracy emerges in which the people choose their leaders but no longer influence the architecture of the decisions those leaders use.</p><h2>The Economics of Control</h2><p>The state is not a monolith. Interests collide within it, professional honour persists, courts function, and some people seriously defend the common good. To claim that the state serves elites in its entirety is to simplify.</p><p>But it is equally naive to overlook the asymmetry between a citizen and organisations that possess capital, data, experts, and access to decision-makers.</p><p>The largest technology companies are building systems without which public institutions may soon be unable to perform their own functions. The state obtains instruments of government. Corporations obtain contracts, lawful access to data, power over standards, and the peculiar durability that comes when a product grows deep into someone else&#x27;s life. The citizen receives services and receives no voice in the arrangement of their underground foundations.</p><p>No secret centre is needed. Foucault would look for the everyday mechanisms through which a multitude of independent interests intertwines into durable power, rather than for an all-powerful puppeteer. Algorithmic centralisation is possible without political centralisation. It is enough for different institutions to depend on the same suppliers, the same models, the same measures of efficiency. Then 1,000 independent decisions begin to sound in unison, and this unison is mistaken for objectivity.</p><p>As early as 1980, Langdon Winner asked whether technical artefacts have politics. His answer was yes. Technology must be judged not only by its usefulness but also by the relations of power it sustains or makes practically inevitable. The height of a bridge can determine which buses reach the beach, and therefore who gets to spend time there.</p><p>Questions of who owns computing capacity, how public procurement terms are written, whether independent audits are allowed, and whether a supplier can be replaced are therefore far from merely technical. They concern where power is located today.</p><h2>The Week the Cracks Began to Speak</h2><p>Sometimes, in a house where we have lived for half a lifetime, a dry crack sounds one night, and for the first time we hear that the walls have a voice, that the beams we have relied on are not eternal, only patient, and that all this time they have held us up through an inertia we mistook for strength, rather than out of loyalty. Digital Europe heard such a crack in an October week in 2026, the same week Parisian school pupils walked along the boulevards.</p><p>On the evening of Saturday 17 October, Mozilla received a report that the private keys of 8 intermediate certificates belonging to the Indian certificate authority eMudhra had been compromised. Such certificates belong to the unseen hierarchy that allows a browser to believe that a bank&#x27;s website really is the bank. The elliptic-curve keys, created back in April 2025, proved so weak that they could be derived from the public certificates almost immediately; one of them was simply the number 4. The company itself allowed that the researcher might have used AI-assisted methods. For 1.5 years, part of the foundation of digital trust had rested on a number among the first a child learns to name. Mozilla withdrew trust from the root certificate from which they descended; about 30,000 certificates were initially estimated to require migration following that withdrawal of trust.</p><p>On that same day, 17 October, Amazon&#x27;s network of honeypots recorded an attempt to exploit a vulnerability the world did not yet know about. Its details leaked online 3 days later, ahead of the scheduled disclosure. On 21 October, PHP&#x27;s developers released emergency fixes for 2 critical flaws collectively named PHP2Shell. They allowed unauthenticated execution of arbitrary code on a server and affected versions from PHP 5.4 through PHP 8.5. Britain&#x27;s National Cyber Security Centre had learned of the problem from OpenAI the previous week, before public disclosure. In the Qualys sample, about 71% of PHP installations were running versions whose ordinary support had expired. Limited backports were prepared for some older branches, but this does not restore full support. In the first 12 hours after disclosure, about 199,000 package installations in that sample received patches.</p><p>On 22 October, a British minister told the House of Lords that 32 government services were unavailable and another 4 were working only partially. The government emphasised that the shutdowns were chiefly precautionary and did not signify a breach. The National Cyber Security Centre sent 50,000 warnings. Unavailable municipal websites were also mentioned in the parliamentary discussion. Precautionary shutdown became part of infrastructure protection; by itself, it proves neither a breach nor a political intention.</p><p>On 21 October, attackers also took over the publishing mechanism of LiteLLM, a popular gateway between applications and language models with about 23 million downloads a week, and distributed an infected version, 1.107.0, for roughly 2 hours. The malicious code lived in the built packages that machines install, rather than in the source code a person can read. It ran whenever Python started and stole keys to cloud services and to the AI models themselves. This was already the project&#x27;s 2nd takeover that year.</p><p>A few days earlier, a stolen credential for a trusted ConnectWise backup application had been used to enter the Microsoft 365 cloud environments of numerous organisations. According to Huntress, nearly 1,000 such environments recorded login attempts, more than 300 of them successful. Sophos researchers observed that the sweep proceeded strictly in ascending order of identifiers, with the indifferent precision of an automaton working through a list rather than choosing a victim. No malware was needed. Trust, granted once and never revoked, was enough.</p><p>None of these events became a catastrophe in the cinematic sense. There were no explosions, no walking machines in the squares, no one toppling camera poles. Something else happened. Within 1 week, it became apparent that Europe&#x27;s digital life rested on 4 quiet assumptions, and each proved fragile.</p><p>The 1st assumption was that complexity protects. Many flaws had survived for decades because finding and weaponising them demanded rare expertise and enormous labour, rather than because they were impossible to see. Machine-assisted vulnerability discovery removes this barrier. It serves the person who repairs and the person who breaks equally well, and whoever gets there first wins.</p><p>The 2nd assumption concerned time. Organisations live by a calendar of approvals, tests, and maintenance windows measured in weeks. Amazon&#x27;s analysts put it with cold clarity. A patching period of 7 or 30 days assumes a delay that no longer exists. An embargo does not preserve the secret, the secret does not hold back the attack, and only hours remain between the disclosure of a weakness and its exploitation.</p><p>The 3rd assumption concerned delivery. We are accustomed to examining code, but not the route by which it reaches us. The LiteLLM case showed that one can read the source down to the last line and still admit someone else&#x27;s will into one&#x27;s home, because the danger lives in the packaging rather than in the text.</p><p>The 4th assumption concerned trust itself. The eMudhra certificates and the ConnectWise application were not compromised in the familiar sense. They were things the system trusted by definition. When what authenticates things breaks, it is the very idea of a door that breaks, rather than the door alone.</p><p>Remember the jealous man in the old story who locked up his beloved in order to know everything about her. He failed to notice that his neighbours had long held the key to his own flat, and that the lock opened with the number 4. The state is learning to predict the citizen, but a public count of unavailable services still does not give citizens a transparent picture of its own infrastructure. It is learning to see straight through a person and is unsure whether it can see itself.</p><p>Power that demands complete transparency from the person itself stands on a foundation whose strength it cannot guarantee.</p><h2>Chaos as a Resource</h2><p>In childhood, a thunderstorm brought a particular order to the house. As soon as the sky above the garden darkened and the first heavy drops struck the leaves, every argument fell silent, the adults closed the shutters, someone lit a lamp, and suddenly it became clear who was in charge, because everyone obeyed whoever knew where the candles were and how to turn off the water. The storm did not establish authority. It revealed it and, for a time, made it unquestionable.</p><p>Carl Schmitt defined the sovereign as the one who decides on the exception. Giorgio Agamben showed how, in the 20th century, the state of exception changed from an exception into an ordinary technique of government. Naomi Klein described how crises are used to implement decisions society would reject in calmer times. Her argument is disputed, but a simple observation is hard to contest. Panic is rarely a time for public debate.</p><p>Chaos need not be manufactured to be used. Here Foucault again protects us from conspiracy theory. No secret centre need set fire to the streets or plant cracks in the code. It is enough that every storm restores power&#x27;s ancient role as the only adult in the house, and that society pays for every night of thunder with a small part of its right to ask questions. In the morning, the storm passes. The shutters often remain closed.</p><p>October 2026 brought Europe 2 kinds of chaos at once. Chaos from below, human, with faces, slogans, and demands, which can be heard, argued with, and negotiated with. And chaos from the machine, impersonal and silent, which cannot be heard out because it demands nothing. The 1st inconveniences power: it asks questions. The 2nd, for all its danger, asks none and suggests only 1 answer. More powers, more surveillance, more speed, less discussion.</p><p>The danger is that these 2 kinds of chaos may end up in the same column of a risk report. Protest will become another anomaly in the data stream, alongside a suspicious package and a broken certificate, and the same logic used for a vulnerability will begin to be applied to it. Detect. Isolate. Disconnect. In the week when government services were shut down as a precaution, disconnection became a protective measure, and it could be reasonable for a specific technical threat. But every act that has once become reasonable in one domain looks for a use in another.</p><p>Another change received almost no discussion. The government learned of the weakness threatening British public systems from a private AI laboratory the previous week, before public disclosure. This was a responsible act, for which we should be grateful. But it exposed a new distribution of power. If knowledge of the state&#x27;s cracks originates with a private actor, the question of when, to whom, and in what order that knowledge is disclosed ceases to belong to the state alone. Sovereignty begins to depend on the good faith of those who can see further.</p><p>If we extend this week towards 2040, at least 4 scenarios emerge, all of them already under way.</p><p>The 1st might be called the fortress. Every wave of machine vulnerabilities justifies a new temporary regime, mandatory continuous network monitoring, the power to switch off services without explanation. Protection of infrastructure and protection against citizens gradually merge into a single department and a single language.</p><p>The 2nd might be called guardianship. States unable to find their own cracks grow increasingly dependent on a few private laboratories that see vulnerabilities first. Protection becomes a service, the service becomes a condition, and the boundary between partnership and dependence blurs just as responsibility blurred along the chain of algorithmic decisions.</p><p>The 3rd might be called the switch. Disconnection, once tried as a cyber security measure, becomes a universal instrument. Communications in a protest area, a payment service, a transport card, access to a public services portal are switched off pre-emptively, on the basis of a risk assessment no one is obliged to disclose, if technical measures are left without a substantive public explanation.</p><p>The 4th might be called the open city. The same machines that find vulnerabilities become a public resource. Independent researchers, universities, and civic organisations examine government code as quickly as it might be attacked. Vulnerability disclosure follows public rules, and the infrastructure of trust is overseen by more than corporations and intelligence agencies alone.</p><p>Which of these prevails depends on who holds the switch, and whether anyone can ask why they turned it, rather than on the power of the models.</p><p>Chaos does not abolish democracy. It tests whether democracy knows how to remain democratic in the dark.</p><h2>Between 2035 and 2040. A Projection of Mechanisms Already at Work</h2><p>The future cannot be deduced from the present like a theorem from axioms. But we can trace a chain of conditions under which one scenario becomes more likely than the others.</p><p>Suppose that before 2040 pressure on public budgets persists, demand for security grows, automation accelerates, institutions grow ever deeper into private digital infrastructure, and trust in political representation continues to melt away. Algorithmic governance will then expand steadily, like water that seeks cracks rather than storming a dam.</p><p>It will first occupy areas where the benefit is measurable and indisputable. Documents, administrative services, resource allocation, transport, identifying violations.</p><p>Then comes the lure of prediction. Institutions will want to know the probability of events in advance rather than respond to them. In medicine, natural disasters, and protection against violence, such tools will save lives.</p><p>And precisely then the temptation will arise to extend the logic of prediction to political and social behaviour. The boundary between preventing violence and pre-empting unwanted civic action will become the most important boundary of the age. Law can hold it. But if the political weather changes, it will become possible to classify groups of people according to calculated signs of what they are likely to do, rather than what they have done.</p><p>In such a world, protest will cease to be only an utterance. It will become an object of risk analysis, modelling, information operations, and pre-emptive administration.</p><p>To neutralise a demonstration, it need not be banned. Access to squares can be changed, approval procedures made more difficult, communication fragmented, information flows diverted, an event automatically flagged as a potential threat. Each measure may be lawful in isolation. A democratic state does indeed have a duty to protect people against violence. The danger begins where security criteria cease to be open to public scrutiny and systematically displace the right to dissent.</p><p>By 2040, a particular kind of political order could emerge in this way. Rather than a dictatorship in the textbook sense, with a leader on a balcony and tanks in the square, it would be a managed society in which many decisions appear technically inevitable, although they rest on thoroughly political preferences simply dressed up as numbers.</p><p>The state will constantly invoke the objectivity of calculation. But calculation does not know what a good society ought to be. It knows how to seek means for given ends. Who sets those ends, and who has the right to change them, remains a political question, and whoever calls it technical has already answered it on our behalf.</p><h2>A Slope, Not a Fate</h2><p>At this point, prophecy usually begins to frighten itself with its own inevitability, and therein lies its chief weakness. The idea of an inevitable future is more than mistaken. It serves the very system it describes, by persuading people that action is pointless.</p><p>Europe is not defenceless. The AI Act prohibits certain forms of social scoring, manipulative practices, certain kinds of prediction of individual criminal behaviour, and real-time remote biometric identification for law enforcement in public spaces, subject to narrowly defined exceptions. The General Data Protection Regulation gives individuals safeguards against decisions made solely by automated means that significantly affect their lives.</p><p>But law in this story is a shoreline rather than a wall, and the water tests it constantly. Exceptions to prohibitions are written by the same hands that write the prohibitions. Temporary regimes are extended. French video analysis began as an Olympic measure and outlived the Olympics. A Dutch court stopped SyRI, but only after the system had had time to operate. Law can impose limits. It cannot impose them by itself.</p><p>At the same time, the same computational systems can strengthen society&#x27;s power over the state as well as the state&#x27;s power over society. They can expose corruption, find errors in decisions, examine budgets, translate laws from officialese into human language, and open legal information to those who previously could not afford it. The OECD&#x27;s 2025 review, based on 200 examples of AI use in the public sector, describes these possibilities alongside the risks of opacity, error, and diluted accountability.</p><p>We therefore face 2 roads paved with the same stone. On one, the state uses computation to expand its ability to see and direct society. On the other, society uses computation to expand its ability to see and correct the state. Both are technically possible. Laws, courts, ownership of infrastructure, civic culture, and political will shall decide which becomes the main road.</p><p>The question is not whether AI will become powerful enough.</p><p>The question is who will set the limits of its power, and whether they will manage to do so before every convenient decision quietly narrows the window.</p><p>Here the apparent contradiction between anxiety and hope resolves itself. The future is not predetermined. But neither does it stand still, waiting for us to make up our minds. It is tilted, and every day spent doing nothing adds another degree to the slope.</p><h2>Protest as an Unforeseen Act</h2><p>Let us return to the streets of Paris and Milan.</p><p>Protest is easy to romanticise. It mingles just demands, political ambitions, solidarity, fear, rage, and the calculations of those who know how to warm their hands at someone else&#x27;s fire. Being in the street is no guarantee of being right. Violence against bystanders, the wrecking of public institutions, and the persecution of dissenters do not become justified because they are carried out in the name of liberation.</p><p>And yet protest is indispensable to democracy. It reminds the state that society&#x27;s life cannot be reduced to its administration, and that the legality of institutions does not yet answer the question of their legitimacy.</p><p>Hannah Arendt connected freedom with the human capacity to begin. Action, for her, brings into the world something that was not there before, rather than reproducing existing conditions. She linked this capacity to natality, to the fact of birth, to the arrival of new people in the world again and again, each bearing the possibility of a beginning.</p><p>Here political freedom and the logic of prediction part ways decisively. For a system of government, perfect predictability means eliminating uncertainty. For history, the complete elimination of uncertainty would mean eliminating the new.</p><p>Freedom, however, is not chaos. It is the right to remain an actor, capable of changing one&#x27;s convictions, entering public debate, reconsidering the order of things, and challenging a decision made about you without you.</p><p>Freedom is not the absence of order. Freedom is the possibility of participating in the revision of the order to which you are subject.</p><p>When that possibility disappears, politics becomes the administration of a population, and the citizen becomes a user allowed to leave feedback.</p><p>Here the final connection between street and server becomes visible. Protest is chaos with a face. It speaks, demands, makes mistakes, and can therefore be spoken to. A machine failure is chaos without a face: it cannot be spoken to, only eliminated. If the state loses the ability to distinguish these 2 disorders, it will begin to treat the citizen as a vulnerability to be patched before anyone learns of it.</p><h2>Power Without a Ruler</h2><p>The most troubling prospect concerns the dispersal of responsibility, in which evil simply happens rather than being committed, instead of an uprising of machines.</p><p>In classical authoritarianism, power has a face. In the future, its functions may be distributed so evenly among institutions and technical intermediaries that it becomes impossible to point to a face. Individual systems will probably learn to plan sequences of actions, select means for given ends, and coordinate the work of other programs. This does not mean they will acquire desires, convictions, or political will. Acting in accordance with a goal does not yet mean experiencing that goal as one&#x27;s own interest.</p><p>The danger is more prosaic, and therefore more serious. People set objectives. Institutions embed them in procedures. Machines execute the procedures with increasing efficiency. Then the efficiency of a procedure becomes an argument against revising it. People are invited to adapt to the most optimised version of a decision made before them, rather than discuss the future.</p><p>Thus power without a ruler emerges. There may be no malicious intention in it at all. But it can restrict freedom as effectively as deliberate coercion, because one can rise against an intention, while against a procedure one can only submit an application.</p><p>In Seeing Like a State (1998), James C. Scott showed why grand projects for the rational reorganisation of society so often ended in catastrophe. The state replaced the living, tangled, opaque complexity of social life with a simplified scheme convenient for governing from above, then tried to make life conform to the scheme.</p><p>In Proust&#x27;s childhood bedroom, a magic lantern throws a cloaked rider onto the walls, and when the rider encounters the door handle, he obediently bends, breaks, and spreads across its brass, without ceasing to be a rider or becoming a door for even an instant. An algorithm treats a person in the same way. Its projection can become as detailed as one wishes, bending around every fold of our lives, every habit, every weakness. But it remains light on a wall. A model of human life, however much data feeds it, does not become life, and even a perfect description of the past confers no right to dispose of the future.</p><h2>What Must Be Preserved Before 2040</h2><p>If these reflections are worth anything, they must end with more than a troubling landscape: they must also name what cannot be surrendered.</p><p>Every automated system that significantly affects human rights must have an identifiable responsible party, a person or body that can be named.</p><p>Decisions affecting a person&#x27;s life, liberty, and opportunities must be open to substantive challenge, rather than a polite notification that the data has been processed correctly.</p><p>Public safety criteria must be defined by law and proportionate to the actual threat.</p><p>Experimental surveillance powers must not become permanent of their own accord. Everything temporary must receive its date of death at birth.</p><p>Public technological infrastructure must remain open to independent audit, public scrutiny, and, as far as possible, replacement.</p><p>And a political decision about ends must not be displaced by a technical conclusion about the best means of achieving them.</p><p>Some of these principles already exist in European law. The task before 2040 is to keep them from becoming names that continue to sound while promising nothing.</p><p>This is no rejection of progress. It is a demand that progress expand human freedom rather than turn it into a secondary indicator of administrative efficiency.</p><h2>The Human Being as an Unfinished Being</h2><p>We die many times in a single life. The person we were at 20, with their passions, fears, and that one face without which the world seemed impossible, quietly departs one day, and another takes their place, remembering them as one remembers a distant relative, no longer understanding why they suffered so much. We do not notice these deaths because each successor inherits the name and passport of the one before. But anyone who, after a long separation, has met a person they once loved knows that they encountered a stranger with a familiar surname.</p><p>The algorithm remains faithful to the dead. It knows who we were through every purchase, journey, and lingering glance, and with reverent precision offers the living person the life of the deceased. It does not need to hate us to imprison us. Fidelity to our past is enough.</p><p>The deepest question of the future is therefore not whether the machine will surpass human intelligence. In some fields it already has. In others it remains limited and unreliable. But intelligence and the right to determine the ends of our shared life are not the same thing. A system can find the optimal way to allocate resources according to a given criterion. The choice of the criterion itself, justice, dignity, solidarity, freedom, belongs to a judgment we cannot hand over without relinquishing ourselves.</p><p>Here a 2nd, quieter layer of danger opens up. Foucault showed that power produces the subject itself, as well as obedience. A long life among algorithmic assessments may therefore change not only our behaviour but our very conception of freedom. A person prompted from childhood towards the next step, the next song, the next profession may one day cease to distinguish a desire from a recommendation. They will not need to be forbidden to choose. They will forget how it is done, sincerely believing the suggestion to be their own taste. At this point political philosophy becomes anthropology, and the question of power becomes a question of what will remain of a human being so conveniently governed.</p><p>Against this, we possess a strange weapon. Sometimes, stumbling on an uneven stone in a courtyard, we suddenly feel an entire forgotten city rise beneath our feet, its light, its water, its morning, absent from every account we have given of ourselves, and realise that we have carried it within us all this time without knowing. A click history does not exhaust that city. Even an accurate prediction cannot replace the return itself: the light, the water, the morning a person experiences now. An unbidden memory, sudden love, an inexplicable refusal, an act we did not expect of ourselves do not prove that computation is impossible in principle. They remind us of something else: a description does not exhaust a person&#x27;s life, and the probability of an action confers no right to decide on their behalf. Their future has not yet been lived.</p><p>A human being is not a finished object whose properties can all be established in advance. We can change, make mistakes, renounce earlier convictions, create unforeseen forms of connection, and act against our own expectations. This unfinishedness makes art, politics, and history possible. It is also the principal obstacle to any system that wants to govern a person once and for all.</p><p>Hence the central paradox of the age we are approaching.</p><p>The more precisely civilisation learns to predict a person, the more resolutely it will have to defend their right not to coincide with the prediction.</p><p>The revolutionaries of 1789 did not know what Europe would become 2 centuries later. The students of 1968 could not foresee the consequences of their own barricades. The young people walking the boulevards of Paris and the streets of Milan today likewise do not know what forms of shared life will be born from the present cracks. But this lack of knowledge is a condition of history, rather than a weakness.</p><p>The future does not lie somewhere ready-made, like a letter waiting only to be opened. It takes shape in the collision of circumstances, structures, and actions, and the last word in that collision has not yet been spoken.</p><p>We should therefore see 2040 as a fork towards which we are walking, each day slightly narrowing or widening both roads, rather than picture it as the inevitable triumph of technological control.</p><p>Will Europe be a society in which technologies help citizens exercise power? Or a society in which technologies help power do without citizens?</p><p>From the outside, these 2 futures may look almost indistinguishable. Both will have smart cities, digital services, automated systems, elections, and rights inscribed in constitutions. The difference will lie in a single gesture, rather than in the scenery. In the 1st, people will be able to change the system they use. In the 2nd, all that remains will be to adapt to it.</p><p>Let us return to the images with which this essay began. Young people walking at dawn across the wreckage of machines are a dream rather than a prophecy, and a consoling dream because freedom is once again won by human hands. The real fork is quieter. It passes through the place where an engineer at 2 a.m. decides whether to update a server or turn it off. Where a minister decides whether to name the services that have been shut down. Where a private laboratory decides whom to tell about a crack first. Where a school pupil decides whether to go out onto the boulevard in the morning.</p><p>The key to an entire layer of digital trust once turned out to be the number 4. Perhaps this is October&#x27;s lesson. The system preparing to calculate the human being to the very end itself rests on assumptions no one has checked, and its strength is as unfinished as the human being. The argument therefore remains open on both sides, and the machine is not its judge. It is a tool created by human beings, whose limitations do not remove the responsibility of those who entrust decisions to it.</p><p>Then the old question of European history will return in a new guise, as a long-forgotten smell returns and suddenly catches in the breath.</p><p>Not who rules.</p><p>But who can still change the very logic of power.</p></article></noscript></body></html>
